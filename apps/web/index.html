<!doctype html>
<html
  lang="en"
  class="h-full"
  autocapitalize="off"
  autocorrect="off"
  autocomplete="off"
  spellcheck="false"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataZen</title>
    <script>
      window.__HTML_START__ = performance.now();
    </script>
    <style>
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0b0e14;
        transition: opacity 0.3s;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .brand {
        color: #e6e9f2;
        font-family: system-ui, sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.04em;
        user-select: none;
      }
    </style>
  </head>
  <body class="h-full antialiased">
    <div id="splash">
      <div class="brand">DataZen</div>
    </div>
    <div id="root" class="h-full min-h-0"></div>
    <script>
      // Safety watchdog: ensure splash is never permanently stuck if module
      // load fails (same guarantee as apps/desktop/index.html, minus the
      // Tauri show-handshake — the browser owns the window here).
      setTimeout(function () {
        var splash = document.getElementById('splash');
        if (splash && !splash.classList.contains('hide')) {
          console.warn('[startup] splash screen safety watchdog triggered after 8s');
          splash.classList.add('hide');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 350);
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
