[package]
name = "datazen-driver-support"
version = "0.0.1"
edition = "2021"
description = "Dependency-free SQL text helpers shared by driver-api, drivers and hosts (host-boundary F3 first slice)"
license-file = "LICENSE-MIT"
repository = "https://github.com/flyxl/datazen"
keywords = ["datazen", "database", "driver", "sql"]
categories = ["database"]

# F3 第一刀：sql_split 与 sql_identifiers 从 driver-api 下沉至此。两个模块
