[package]
name = "datazen-driver-sqlite"
version = "0.0.8"
edition = "2021"
description = "DataZen sqlite database driver"
license = "GPL-3.0-or-later"

[dependencies]
datazen-driver-api = { path = "../../driver-api" }
async-trait = "0.1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "json"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# F7: AST-level dialect-aware SQL target qualification (dialect binding lives in src/sql_target.rs)
sqlparser = { version = "0.59", features = ["visitor"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
