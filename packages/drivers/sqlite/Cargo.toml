[package]
name = "datazen-driver-sqlite"
version = "0.0.8"
edition = "2021"
description = "DataZen sqlite database driver"
license = "GPL-3.0-or-later"

[dependencies]
datazen-driver-api = { path = "../../driver-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "json"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
