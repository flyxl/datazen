[package]
name = "datazen-driver-redis"
version = "0.0.8"
edition = "2021"
description = "DataZen redis database driver"
license = "GPL-3.0-or-later"
build = "build.rs"
links = "redis"

[features]
default = []
tauri-plugin = ["dep:tauri"]

[dependencies]
datazen-driver-api = { path = "../../driver-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "cluster-async", "sentinel", "tls-rustls", "tls-rustls-insecure", "tokio-rustls-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
urlencoding = "2"
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
