[package]
name = "datazen-driver-jdbc"
version = "0.0.1"
edition = "2021"
description = "DataZen generic JDBC driver via external Java Agent"
license = "GPL-3.0-or-later"

[dependencies]
datazen-driver-api = { path = "../../driver-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
