[package]
name = "datazen-driver-hbase"
version = "0.0.8"
edition = "2021"
description = "DataZen hbase database driver"
license = "GPL-3.0-or-later"

[dependencies]
datazen-driver-api = { path = "../../driver-api" }
datazen-driver-http-support = { path = "../http-support" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[dev-dependencies]
wiremock = "0.6"
