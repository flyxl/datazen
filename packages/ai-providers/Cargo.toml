[package]
name = "datazen-ai-providers"
version = "0.0.1"
edition = "2021"
description = "DataZen AI provider contracts (trait, types, factory) and vendor protocol adapters"
license = "GPL-3.0-or-later"

[dependencies]
datazen-platform-infra = { path = "../platform-infra" }
# 契约层（自 datazen-ai-api 并入）：链接期工厂注册与流式传输工具
inventory = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream", "cookies", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"
wiremock = "0.6"
