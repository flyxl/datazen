[package]
name = "datazen-platform-infra"
version = "0.1.0"
edition = "2021"
description = "Cross-form platform infrastructure primitives for DataZen: credential redaction and archive path safety"

[dependencies]
# Deliberately zero datazen-* dependencies: this crate is the bottom of the
# platform DAG (enforced by F-11). Add capabilities here before adding a new
# shared crate for them; do NOT add a crate for them.
#
# Declared directly, not inherited from the root [workspace.dependencies] table:
# that table carries only the seven path crates, so there is no root entry to
# inherit from — and this crate's dependency list is part of the F-11 boundary
# review (no datazen-* layer, no platform transport).
regex = "1.13.1"
url = "2"
