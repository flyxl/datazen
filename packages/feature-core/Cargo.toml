[package]
name = "datazen-feature-core"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Portable workflow, AI, MCP and dashboard application logic"

[dependencies]
# 机制内核（job / budget / sql_guard / schema_cache / driver_registry）：领域包只用机制，
# 不依赖「连接资源运行时」整包（DDD 计划 P2 的落点）。
datazen-kernel = { workspace = true }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rand = "0.8"
dirs = "5"
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
datazen-schema-diff = { workspace = true }
datazen-driver-api = { workspace = true }
datazen-platform-api = { workspace = true }
# 设置词汇（ExecutionSettings 等）自 D1 起由 datazen-modules::settings 拥有。
datazen-modules = { workspace = true, features = ["settings", "ai", "connection", "named_views"] }
datazen-infra = { path = "../infra" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
regex = "1"
sha2 = "0.10"
sqlparser = { version = "0.59", features = ["visitor"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

[dev-dependencies]
# 只有测试可以点名 Runtime 门面：`schema_context` 的行为用例需要一个真实
# `RuntimeConnectionUseCases`（fakes 的端口实现无法覆盖它的分页/可见性语义）。
# 生产依赖里已无它——R1 要求领域包不得依赖连接运行时。
datazen-runtime = { path = "../runtime" }
tempfile = "3"
