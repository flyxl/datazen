[package]
name = "datazen-feature-core"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Portable workflow, AI, MCP and dashboard application logic"

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
rand = "0.8"
dirs = "5"
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
datazen-schema-diff = { workspace = true }
datazen-runtime = { path = "../runtime" }
datazen-driver-api = { workspace = true }
datazen-ai-api = { path = "../ai-api" }
datazen-platform-api = { workspace = true }
datazen-platform-infra = { path = "../platform-infra" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
regex = "1"
sha2 = "0.10"
sqlparser = { version = "0.59", features = ["visitor"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
