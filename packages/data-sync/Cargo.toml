[package]
name = "datazen-data-sync"
version = "0.0.1"
edition = "2021"
description = "Data Synchronization domain engine for DataZen: gate, compare, changeset, execute"
license = "GPL-3.0-or-later"

[dependencies]
# D5：唯一定义在 datazen-modules::data_sync；本 crate 只再导出垫片。
datazen-modules = { workspace = true, features = ["data_sync"] }
[dev-dependencies]
tempfile = "3"
datazen-driver-postgres = { path = "../drivers/postgres" }
datazen-driver-mysql = { path = "../drivers/mysql" }
datazen-driver-sqlite = { path = "../drivers/sqlite" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 集成测试（cm43…cm46 / filter_operator_refusal / handler_plan_guard）直接
# use 的 crate——原来由本 crate 的 [dependencies] 提供，垫片化后改挂
# dev-deps（cargo 对 integration test 同时暴露两类依赖）。
datazen-kernel = { workspace = true }
datazen-driver-api = { workspace = true }
datazen-platform-api = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
