[package]
name = "datazen-infra"
version = "0.1.0"
edition = "2021"
description = "Shared infrastructure utilities for DataZen (renamed from platform-infra on 2026-10-26, D1.5): credential redaction and archive path safety for every consumer class (drivers / modules / web / desktop)"

[dependencies]
# Deliberately zero datazen-* dependencies: this crate is the bottom of the
# platform DAG (enforced by F-11). Add capabilities here before adding a new
# shared crate for them; do NOT add a crate for them.
#
# Declared directly, not inherited from the root [workspace.dependencies] table:
# that table carries the path crates plus the shared external specs consumed in
# lockstep by modules / the desktop host / the drivers — while this crate's
# dependency list is part of the F-11 boundary review (no datazen-* layer, no
# platform transport), so it stays self-contained on purpose.
regex = "1.13.1"
url = "2"
