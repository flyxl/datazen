[package]
name = "datazen-data-transfer"
version = "0.0.1"
edition = "2021"
description = "Data Transfer domain engine for DataZen: heterogeneous IR migration pipeline"
license = "GPL-3.0-or-later"

[features]
webdriver = []

[dependencies]
datazen-driver-api = { workspace = true }
datazen-data-sync = { path = "../data-sync" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1.9"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
datazen-driver-postgres = { path = "../drivers/postgres" }
datazen-driver-mysql = { path = "../drivers/mysql" }
datazen-driver-sqlite = { path = "../drivers/sqlite" }
