[package]
name = "datazen-data-transfer"
version = "0.0.1"
edition = "2021"
description = "Data Transfer domain engine for DataZen: heterogeneous IR migration pipeline"
license = "GPL-3.0-or-later"

[features]
webdriver = []

[dependencies]
# D5：唯一定义在 datazen-modules::data_transfer；本 crate 只再导出垫片。
datazen-modules = { workspace = true, features = ["data_transfer"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
datazen-driver-postgres = { path = "../drivers/postgres" }
datazen-driver-mysql = { path = "../drivers/mysql" }
datazen-driver-sqlite = { path = "../drivers/sqlite" }
# 集成测试（filter_operator_refusal）直接 use 的契约 crate。
datazen-driver-api = { workspace = true }
