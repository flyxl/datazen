[package]
name = "datazen-schema-diff"
version = "0.0.1"
edition = "2021"
description = "Schema Diff domain engine for DataZen: comparison, review, plan, deploy"
license = "GPL-3.0-or-later"

[dependencies]
datazen-driver-api = { workspace = true }
datazen-platform-api = { path = "../platform-api" }
datazen-runtime = { path = "../runtime" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
datazen-driver-postgres = { path = "../drivers/postgres" }
datazen-driver-mysql = { path = "../drivers/mysql" }
datazen-driver-sqlite = { path = "../drivers/sqlite" }
