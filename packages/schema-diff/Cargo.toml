[package]
name = "datazen-schema-diff"
version = "0.0.1"
edition = "2021"
description = "Schema Diff domain engine for DataZen: comparison, review, plan, deploy"
license = "GPL-3.0-or-later"

[dependencies]
# D5：唯一定义在 datazen-modules::schema_diff；本 crate 只再导出垫片。
datazen-modules = { workspace = true, features = ["schema_diff"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 集成测试（tests/job_handler.rs）经垫片链消费旧路径：
# kernel::job / platform-api 词汇 / schema-diff 门面，验证垫片装配不破。
datazen-platform-api = { workspace = true }
datazen-driver-api = { workspace = true }
async-trait = "0.1"
serde_json = "1"
