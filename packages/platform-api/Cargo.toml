[package]
name = "datazen-platform-api"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Transport-free platform contracts: ID newtypes, RequestContext, target types, port traits, cross-boundary errors (PortError/ApiError) and the shared use-case port signatures."
exclude = ["src/testing/**"]

[features]
default = []
# `test-harness` 只是把 `#[cfg(test)]` 之外的 `src/testing/**` 也编进来，
# 让没有 Tauri 的普通测试进程能装配假端口。cfg 决定是否编译，exclude 决定 cargo package 收不收。
test-harness = []

[dependencies]
async-trait = "0.1"
# 只用于 `SystemClock` 把当前时刻写成定宽 RFC3339（`clock` 特性即 `now` + `std`）。
# 契约层**不解析**时刻：`Timestamp` 的比较与算术仍由各调用方负责。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 隧道定义与隧道配置形状（`SavedTunnel` / `TunnelKind` / `SshTunnelConfig` …）住在
# 驱动契约 crate：那是**每个形态都已经链接**的那一份。端口因此复用它们，而不是
# 在契约层再抄一份（两份摘要类型只会在两处之间慢慢漂移）。
# F-04 允许这条边：`application` / `runtime` / 领域包 / `src-tauri` 一律不许依赖。
datazen-driver-api = { workspace = true }
datazen-modules = { workspace = true, features = ["settings", "connection", "execution", "jobs", "history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
