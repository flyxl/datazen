[package]
name = "datazen-application"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "DataZen 应用层：用例编排、ApplicationServices 聚合（含领域端口）、目标计算与身份策略判定顺序"
exclude = ["src/testing/**"]

[features]
default = []
test-harness = []

[dependencies]
datazen-platform-api = { workspace = true }
datazen-feature-core = { workspace = true }
datazen-schema-diff = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 隧道端口（`datazen_platform_api::ports::TunnelRepository`）的方法签名引用驱动
# 契约 crate 的隧道类型（`SavedTunnel` / `SavedTunnelSummary` / `TunnelUsage`）。
# 生产代码只持有 `Arc<dyn TunnelRepository>`，**不点名**那些类型，因此不需要这条
# 依赖；只有测试里实现该端口的替身时才需要。它是 dev-dependency ⇒ 不进
# normal/build 依赖闭包，F-02 的判定不受影响。
datazen-driver-api = { workspace = true }
# 测试期解析器：模块清单守卫用 syn 取 crate 顶层 items，而不是手写词法分析。
# 只用 include_str!("lib.rs")，不触碰被测代码；dev-dependency 不进 normal/build 闭包。
syn = { version = "2", features = ["full"] }
# span-locations 让 syn 的 span 带上真实源码位置，fail-closed 诊断才能点名精确行号。
proc-macro2 = { version = "1", features = ["span-locations"] }
