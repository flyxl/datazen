name: Publish Driver API

on:
  workflow_dispatch:
  push:
    tags:
      - 'datazen-driver-api-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish datazen-driver-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check crate
        run: cargo check -p datazen-driver-api

      - name: Test crate
        run: cargo test -p datazen-driver-api

      - name: Package crate
        run: cargo package -p datazen-driver-api

      - name: Publish crate
        run: cargo publish -p datazen-driver-api --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
