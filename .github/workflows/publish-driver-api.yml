name: Publish Driver API

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish to crates.io'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'datazen-driver-api-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish datazen-driver-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check crate
        run: cargo check -p datazen-driver-api

      - name: Test crate
        run: cargo test -p datazen-driver-api

      - name: Package crate
        run: cargo package -p datazen-driver-api

      - name: Publish dry run
        run: cargo publish -p datazen-driver-api --locked --dry-run

      - name: Publish crate
        if: github.event_name == 'push' || inputs.publish == true
        run: cargo publish -p datazen-driver-api --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
