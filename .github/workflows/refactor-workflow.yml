name: One-time workflow module extraction

on:
  push:
    branches:
      - agent/driver-command-workflow

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'chore: remove one-time workflow extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/driver-command-workflow

      - name: Extract workflow modules
        run: |
          python3 <<'PY'
          from pathlib import Path

          src = Path('src-tauri/src/workflow/workflows.rs')
          text = src.read_text()

          def section(start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          model = section('// ─── Data Model', '// ─── Registry')
          registry = section('// ─── Registry', '// ─── Executor')
          executor = section('// ─── Executor', '// ─── Context')
          context = section('// ─── Context', '// ─── Condition Evaluator')
          conditions = section('// ─── Condition Evaluator', '// ─── Tests')

          # Keep the already-maintained model/registry/context files. They are
          # intentionally the canonical versions created by the migration.
          # Replace only executor/condition modules from the source of truth.
          Path('src-tauri/src/workflow/conditions.rs').write_text(
              '''//! Workflow condition expression evaluation.\n\nuse super::context::WorkflowContext;\n\n''' + conditions.split('\n', 1)[1]
          )

          executor_body = executor.split('\n', 1)[1]
          executor_header = '''//! Workflow execution engine.\n\nuse crate::commands::AppState;\nuse crate::mcp::permission::{self, McpPermissionMode};\nuse datazen_ai_api::{ChatMessage, CompletionRequest, MessageRole};\nuse super::context::WorkflowContext;\nuse super::model::*;\nuse super::command::WorkflowCommandStep;\nuse super::command_runtime;\nuse super::conditions::evaluate_condition;\nuse std::time::Instant;\nuse uuid::Uuid;\n\n'''
          Path('src-tauri/src/workflow/executor.rs').write_text(executor_header + executor_body)

          # Keep only module-level compatibility items in workflows.rs.
          facade = '''//! Backwards-compatible workflow facade.\n//!\n//! The implementation is split into model, registry, context, conditions,\n//! command runtime, and executor modules. Existing callers can continue to\n//! import the public workflow types through this module.\n\nuse crate::mcp::permission::{self, McpPermissionMode};\n\n/// Documented workflow query row cap (`docs/architecture/security.md`).\npub const WORKFLOW_QUERY_ROW_LIMIT: u32 = 1000;\n\n/// Options that differ between GUI and MCP invocation surfaces.\n#[derive(Debug, Clone)]\npub struct WorkflowExecuteOptions {\n    pub permission_mode: Option<McpPermissionMode>,\n    pub query_row_limit: Option<u32>,\n}\n\nimpl Default for WorkflowExecuteOptions {\n    fn default() -> Self {\n        Self { permission_mode: None, query_row_limit: Some(WORKFLOW_QUERY_ROW_LIMIT) }\n    }\n}\n\n/// Shared guard used by query steps.\npub fn enforce_workflow_query_guards(\n    sql: &str,\n    permission_mode: Option<McpPermissionMode>,\n) -> Result<(), String> {\n    if let Some(mode) = permission_mode { permission::check_sql_allowed(sql, mode)?; }\n    Ok(())\n}\n\npub use super::command::WorkflowCommandStep;\npub use super::context::WorkflowContext;\npub use super::executor::WorkflowExecutor;\npub use super::model::{\n    ErrorHandlingConfig, ErrorStrategy, ErrorStrategyKind, StepExecutionResult, StepStatus,\n    WorkflowDefinition, WorkflowExecutionResult, WorkflowListItem, WorkflowOutput, WorkflowStep,\n    WorkflowVariable,\n};\npub use super::registry::WorkflowRegistry;\n'''
          src.write_text(facade)
          PY

      - name: Register extracted modules
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/workflow/mod.rs')
          s=p.read_text()
          s=s.replace('pub(crate) mod model;', 'pub mod model;')
          s=s.replace('pub(crate) mod registry;', 'pub mod registry;')
          if 'pub mod context;' not in s: s=s.replace('pub mod command;', 'pub mod command;\npub mod context;\npub mod conditions;\npub mod executor;')
          p.write_text(s)
          PY

      - name: Commit extracted modules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/workflow .github/workflows/refactor-workflow.yml
          git diff --cached --quiet || git commit -m 'refactor: split workflow implementation into modules'
          git push origin agent/driver-command-workflow
