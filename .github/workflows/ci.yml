name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: unit tests only need to read the repo. Do not attach
# plugin Deploy Key secrets here (forks / PRs must never see them).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATAZEN_KEYRING: file

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # generated.ts / plugin_init must stay as empty stubs in git; resolve-drivers injects at build.
      - name: Guard managed driver stubs are not injected
        run: node scripts/check-managed-stubs.mjs

      - name: Guard Host structure caps registry absent
        run: node scripts/check-structure-editor-guardrails.mjs

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Site SEO/i18n checks
        run: node scripts/check-site-seo.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux system deps (Tauri / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Resolve drivers (basic)
        run: node scripts/resolve-drivers.mjs --drivers=basic

      - name: Rust unit tests (driver API)
        run: cargo test -p datazen-driver-api --lib

      - name: Driver API coverage (new command API >= 80%)
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov -p datazen-driver-api --lib \
            --include-files 'packages/driver-api/src/command.rs' \
            --fail-under-lines 80

      - name: Rust unit tests (datazen)
        run: |
          FEATURES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.plugin-features.json','utf8')).features.join(','))")
          cargo test -p datazen --lib --features "$FEATURES"

      - name: Rust unit tests (basic path drivers)
        run: cargo test -p datazen-driver-postgres -p datazen-driver-mysql -p datazen-driver-sqlite -p datazen-driver-redis --lib

      - name: Restore managed files
        if: always()
        run: node scripts/plugin-file-stash.mjs restore

      - name: Rust unit tests (datazen-ai-api)
        run: cargo test -p datazen-ai-api --lib
