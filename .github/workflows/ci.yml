name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# 同一提交重复触发时取消旧 run；不同提交各自完成对应 CI。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATAZEN_KEYRING: file
  # 仓内默认关闭 pnpm 的 run 前依赖校验（工作树的 node_modules 是软链，那次安装必然
  # 失败，见 pnpm-workspace.yaml）。CI 必须在这里显式打开，否则「node_modules 与锁文件
  # 不同步」就没有任何环节会发现。缺失时 verifyDepsBeforeRun 会取文件里的默认值 false。
  DATAZEN_VERIFY_DEPS_BEFORE_RUN: install

jobs:
  # Run only the CI half changed since the last successful run for this PR or
  # branch. A first run checks the whole PR/push range; manual runs stay full.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test CI scope resolver
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_ci_scope

      - name: Classify changes since previous CI run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_scope.py

  # ── 前端段：pnpm → codegen → typecheck → 守卫 → 单测 → site 检查 ──
  # 与 rust job 并行：两者互不依赖（Rust 段不消费 typecheck/单测产物，
  # 前端段不消费 cargo 产物），墙钟时间 = max(前端, Rust) 而非两者之和。
  frontend:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # 全量历史：site SEO/i18n 检查要用 base sha / event.before 做 diff。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # builtinLocales.ts is git-ignored codegen. Ensure it exists before
      # typecheck (the prepare hook also generates it, but this makes the
      # dependency explicit and covers CI caches that skip prepare).
      - name: Generate built-in locale codegen
        run: node scripts/generate-builtin-locales.mjs

      - name: TypeScript typecheck
        run: pnpm typecheck

      # 5 个严格守卫合并为一步：任何失败立即停止（fail-fast），
      # 输出清晰标注哪条命令失败。省掉 5 次 shell launch 开销。
      #
      # version / ci-docs / guardrails 三条已移到 release.yml 的 pre-release-guards
      # （理由见该 job 注释）：它们只在发布这一刻才有意义，不该让每个 PR 都付这
      # 几次 shell launch，也不该让版本号或文档矩阵的短暂不一致拦住与它无关的
      # 功能 PR。per-PR 门禁只保留"改错了就必须在合并前发现"的那几条。
      # driver-protocol 门禁已于 2026-10-21 退役：仓库已无第三方驱动生态，协议版本
      # 冻结于 6（治理决定见 docs/architecture/backend/drivers.md §2.5）。
      - name: All strict guards (stubs, IDs, layers, boundaries, i18n keys)
        run: |
          node scripts/check-managed-stubs.mjs
          pnpm test:ids
          pnpm test:layers
          pnpm test:boundaries
          pnpm test:i18n-keys

      - name: Frontend unit tests
        # No Pro here, and no Pro opt-out. `packages/pro-extensions/**` is a
        # path this repository does not own, so every guard below prunes it at
        # the walk (see `SKIP_PATH_PREFIXES` in scripts/lib/scanTargets.mjs) and
        # no test in this suite reads it. There is no seam gate to waive: the
        # cross-repo assertions live in the Pro repo and run in the Pro's CI.

        run: pnpm test:unit

      # Path 驱动 UI 单测（AGENTS.md「驱动测试落点」表）。宿主单测不碰
      # packages/drivers，所以 `pnpm test:unit` 从不收集这些用例；不单独跑一步
      # 就没有任何合并门禁执行它们。放在 codegen（`pretest:unit` 产生的
      # generated.ts）之后、site 检查之前，避开 rust job 里 resolve-drivers 那段。
      - name: Driver UI unit tests
        run: pnpm test:unit:drivers
      # The step above only ever judges `basic`, because that is what
      # `pnpm install`'s prepare hook seeds (ensure-generated-drivers.mjs ->
      # resolve-drivers.mjs default). A driver form `basic` does not register
      # (e.g. `sqlserver`) therefore escapes Host unit coverage entirely.
      # This step judges the suite under `all` (all registered PATH drivers:
      # no git driver, so no deploy key and no network needed), **narrowed at
      # run time** to the test files whose module graphs execute the
      # driver-set codegen (`src/extensions/generated.ts`) — everything else
      # runs byte-identical code under `all` and is already judged by the
      # `basic` step above. The selection lives in
      # select-codegen-sensitive-tests.mjs (criterion + fail-closed list) and
      # the driver set lives only in run-unit-driver-set.mjs, never inline
      # here.
      #
      # Status: GREEN, not known-red. An earlier revision of this comment
      # claimed two blockers; both were artifacts of a stale base
      # (7f35e1932, which predates d1edfa7ba / f4c2e5078 by 9 commits) and
      # do not exist on feat/platform-p0 @ 7559759b7. Re-measured there with
      # codegen --drivers=all + generate-builtin-locales:
      #   Test Files 555 passed (555) | Tests 5677 passed (5677), exit 0, 140s
      #   tester_tunnelValidationMatrix.test.tsx alone: 36 passed, exit 0
      # The ContentView / QueryPanel.executeCancel failures named earlier were
      # the ones cbf87a4c0 fixed ("修复 schemaStore/panelStore mock 漂移导致
      # 的 18 个前端单测失败"). Do not reintroduce a blocked list here without
      # re-measuring on the current base.
      #
      # HARD GATE — promoted from `continue-on-error: true`.
      #
      # It was soft while this step and the 10s testTimeout below had never
      # executed on a real GitHub runner, so a green 8-core dev-host run was
      # not evidence about a runner whose spec this project does not control.
      # That observation window is now closed by decision. The two edits are
      # ONE change: the `continue-on-error` removed from this step, and the
      # assertion in scripts/__tests__/run-unit-driver-set.test.ts that used
      # to require it to be true and now requires its ABSENCE. Re-adding it
      # deliberately has to redo both, or the suite goes red.
      #
      # Residual risk, stated rather than hidden: the first real-runner
      # execution may go red for reasons unrelated to this branch. The
      # measured budget below plus `retry: 2` in vitest.config.ts are what
      # absorb it — neither is a licence to widen either number.
      #
      # Timeout budget, measured not guessed (per-test wall time, all 5714
      # tests, --reporter=json):
      #   2 workers, load 13  (a local --maxWorkers=2 low-load run) p95 57ms  p99 170ms  max  1745ms
      #   8 workers, load  7  (mild contention)                    p95 118ms p99 336ms  max  4392ms
      #   8 workers, load 48  (6-7x contention)                    p95 329ms p99 918ms  max 11629ms
      # Vitest's 5s default leaves the load-7 worst case at 88% of budget, so
      # it has no headroom under any further contention. Note testTimeout only fires for
      # tests that yield: in the load-48 run the three slowest tests (11629ms,
      # 6540ms, 5236ms) overran 5s and still passed, and the only real timeout
      # was DataTransferWindow, which awaits. Full derivation in
      # docs/development/ci-test-matrix.md.
      - name: Frontend unit tests (all path drivers)
        run: pnpm test:unit:driver-set

      - name: Check site changes
        id: site-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -q '^site/'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Site SEO/i18n checks
        if: steps.site-changes.outputs.site_changed == 'true'
        run: node scripts/check-site-seo.mjs

  # ── Rust 段：工具链 → 系统依赖 → rust-cache → 驱动注入 → cargo 测试 ──
  rust:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # 浅克隆即可：basic 预设全是 path 驱动，resolve-drivers 不做 git fetch；
      # 需要全量历史的 site diff 只在 frontend job。
      - uses: actions/checkout@v5

      # resolve-drivers.mjs → resolve-pro.mjs → pack-ep.mjs 顶层 import 了
      # fflate（ESM 静态解析），所以驱动注入同样需要 node_modules。
      # pnpm store 走 setup-node 缓存，这一步开销很小。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # dtolnay/rust-toolchain 固定跑
          #   rustup toolchain install stable --profile minimal
          # 而 `minimal` 只含 rustc / rust-std / cargo。rustfmt 属于 `default`
          # profile（default = minimal + rust-docs + rustfmt + clippy），不在
          # minimal 里，所以不写这一行时 rustfmt 不由本 workflow 保证存在。
          # 现状之所以还能用，是 ubuntu-latest 镜像恰好预装了 rustfmt 1.9.0，
          # 而 rustup 不会卸载已装 toolchain 上 profile 之外的 component ——
          # 那是镜像的事实，不是本文件的契约（`ubuntu-latest` 已公告将切到
          # Ubuntu 26.04）。显式声明的代价是「已存在时一次 no-op」，收益是下面
          # 的 fmt 硬门禁从「碰巧能跑」变成「保证能跑」。
          components: rustfmt

      # 为什么缓存 + 超时（2026-10-23 实测三数据点）：同一份代码，run
      # 39977765626 的本步在 15:23 挂起 >21 分钟、无报错无进展（runner 到
      # Ubuntu 归档的连接停滞），而相邻两次 run 同一步分别 32s（#123 旧
      # head 07f944293）与 24s（main 0de838522）。apt 对「已连接但静默」
      # 的归档连接默认几乎不限时，所以停滞不红、只挂，直到 job 超时。
      # 两层修法：
      #   1) 显式 30s 超时 + 5 次重试——停滞要么恢复，要么几分钟内红；
      #   2) 缓存下载过的 .deb（Dir::Cache::archives 重定向到 runner
      #      可写目录）——首个绿 run 之后下载段从归档消失，归档抽风日免疫。
      # 缓存键随本文件哈希：依赖列表一变自动失效，无需手工簿记。
      - name: Cache apt archives (Tauri Linux system deps)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-tauri-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-tauri-${{ runner.os }}-

      - name: Install Linux system deps (Tauri / webkit2gtk)
        run: |
          # 缓存 miss 时 cache action 不建目录；命中时恢复的目录也不含
          # partial/。apt 要求两者齐备（2026-10-23 run 39981783597 实测：
          # E: Archives directory .../apt-archives/partial is missing），
          # 故每轮显式创建。
          mkdir -p ${{ runner.temp }}/apt-archives/partial
          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o APT::Keep-Downloaded-Packages=1 \
            -o Dir::Cache::archives=${{ runner.temp }}/apt-archives \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Resolve drivers (basic)
        run: node scripts/resolve-drivers.mjs --drivers=basic

      # HARD GATE — Rust 格式。此前 CI 从不检查。
      #
      # `.husky/pre-commit` 里有 `cargo fmt --all`，但它是「改写」而不是「失败」，
      # 且 `git commit --no-verify` 可绕过。所以在加这一步之前，rustfmt 规则在 CI
      # 上没有任何约束力：任何未格式化的 .rs 都能过一个全绿的 CI。rust job 原有
      # 16 个 step，全是 test / 守卫 / codegen，没有一个跑 fmt。
      #
      # 位置是被迫的，不是排版偏好。`cargo fmt --all` 要加载 Cargo workspace，
      # 而 src-tauri/src/lib.rs 声明了 `mod driver_init`，其文件是 gitignored 的
      # codegen，只有 resolve-drivers.mjs 会生成。放在那一步之前，本门禁连加载
      # 都做不到（实测，非推断）：
      #   Error writing files: failed to resolve mod `driver_init`:
      #   src-tauri/src/driver_init.rs does not exist          → EXIT=1
      # 所以本步必须排在 Resolve drivers 之后。
      #
      # 基线实测（对 `git archive HEAD` 展开的 dcc1d9da2 纯净树，`--drivers=basic`，
      # 与 CI 同一注入序列）：`cargo fmt --all -- --check` EXIT=0，覆盖 801 个
      # .rs（800 个受版本控制的 + 生成的 driver_init.rs）。即本门禁在当前 main
      # 上是绿的，不会让首次运行变红。
      #
      # 不加 continue-on-error / allowlist / `|| true`：脏树必须 fail。
      - name: Rust formatting
        run: cargo fmt --all -- --check

      # driver-api 不依赖 --features / 注入产物，且没有 tests/ 目录——`--lib`
      # 就是它的全部测试面。
      #
      # 四个 basic path 驱动的 lib 单测不再在这里跑：下面的 `--tests` 步按
      # cargo 的目标选择语义（lib target 的 test=true 默认开启）同样会编译
      # 并运行它们的 lib 单测，此前两步让每轮 CI 把同一批 lib 测试函数执行
      # 两遍（实测合计 936 个）。驱动 lib 单测不读
      # DATAZEN_CONTRACT_ALLOW_UNVERIFIED——该变量只被 tests/ 下的 live 契约
      # 模板读取（rg 全仓验证：命中全部位于 */tests/*，无一在 */src/*），所以
      # 在带豁免的 `--tests` 环境下运行与原来的严格 `--lib` 环境行为一致，
      # 去重不损失任何信号。
      - name: Rust unit tests (driver API)
        run: cargo test --lib -p datazen-driver-api

      # ── 驱动集成测试（tests/ 目录）──
      #
      # 本步用 `--tests`：按 cargo 目标选择语义，它编译并运行每个驱动
      # test=true 的全部 target——含 lib 单测（这就是上面那条不再列四个
      # path 驱动的原因）与 tests/ 下的全部集成 target。basic 四驱动一共
      # 有 32 个集成测试文件，在 `--tests` 步加入之前 CI 一个都没编译过：
      # 它们是共享模板与各驱动自有逻辑的宿主，坏掉时门禁不会响。
      # 「今天能编译是运气，不是门禁」的判断仍然成立。
      #
      # 用 `--tests` 而不是逐个 `--test`：`--tests` 编译并运行该 crate 下的全部
      # 集成 target，新加的文件自动进矩阵，不需要有人记得同步名单。
      #
      # 不加 `|| true`、不加 continue-on-error：脏树必须 fail。
      #
      # live 契约层默认严格：验不到的维度判失败，而不是「打印一行未验证、再被 libtest
      # 记成 ok.1 passed」。本 workflow 全文件没有 `services:`，没有 postgres / mysql
      # 容器，也没有任何 `TEST_PG_*` / `TEST_MYSQL_*`，所以不显式豁免就等于让整条
      # 集成测试链红掉（实测 42 个测试翻转；本命令不带 --no-fail-fast，cargo 会在
      # 第一个失败的 binary 就停，例如 datazen-driver-mysql 的 migration_bound_writes）。
      # 那是环境缺失，不是被验证过的失败。
      #
      # 所以豁免写死在命令里：`DATAZEN_CONTRACT_ALLOW_UNVERIFIED=1` 是「此处没有数据库、
      # live 层不验」的**显式声明**，不依赖「没设就宽松」的默认值。模板仍会逐维度走一遍
      # 门闸，只是以「未验证」记账（libtest 会吞掉通过用例的 stdout，所以那些
      # `⏭ 未验证` 行不会出现在 CI 日志里）。
      #
      # 要在 CI 里真验 live：先 provision 数据库并注入 `TEST_PG_*` / `TEST_MYSQL_*`，
      # 再去掉这个豁免——`DATAZEN_CONTRACT_REQUIRE_LIVE=1` 压过豁免，门禁立刻恢复严格。
      - name: Driver integration tests (basic path drivers, tests/)
        run: DATAZEN_CONTRACT_ALLOW_UNVERIFIED=1 cargo test -p datazen-driver-postgres -p datazen-driver-mysql -p datazen-driver-sqlite -p datazen-driver-redis --tests

      - name: Rust unit tests (datazen)
        run: |
          FEATURES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.driver-features.json','utf8')).features.join(','))")
          cargo test -p datazen --lib --features "$FEATURES"

      - name: Restore managed files
        if: always()
        run: node scripts/driver-file-stash.mjs restore

      - name: Rust unit tests (datazen-ai-api)
        run: cargo test -p datazen-ai-api --lib

      # ── 平台内核架构门禁 ──
      #
      # 必须落在这里，不能并进 frontend 的「All strict guards」：那条门禁所在 job
      # 没有 Rust 工具链（工具链在下面 rust job 的 dtolnay/rust-toolchain@stable），
      # 而本门禁要读 `cargo metadata` 的 feature-resolved 图。放在 restore 之后，
      # 断言的是提交态的 workspace 清单，与本地开发者看到的一致。
      #
      # 门禁本身不带 crate 名单：清单来自 workspace membership + §2.4 的路径，
      # 新 crate 落到 packages/application / packages/platform-api / server 下就自动入网，
      # 不需要在这里改任何一处列表。列不出来的 member 是 error 不是 pass。
      - name: Platform crate dependency boundaries
        run: pnpm test:platform-arch

      # DDD 分层门禁（P0 断环的前向不变量）。同样要读 `cargo metadata`，所以只能落在
      # rust job；放在边界门禁之后，理由是两者的失败语义不同：边界门禁断"层与层之间
      # 不许连"，本门禁断"内层之间的环不许回来"，以及"application → 领域包这条边今天
      # 仍然加得进去"（后者是 P0 的验收口径，见 docs/development/ddd-refactor-plan.md）。
      - name: DDD layer invariants (no cycle, R2, domain closure)
        run: pnpm test:ddd-layers

      # 新增共享基础设施 crate 的 panic 门禁。同样落在这里，理由和上面那条一样：
      # 它要先解析 `cargo metadata` 才能把显式目标目录认成 workspace member，而
      # frontend job 没有 Rust 工具链；放在 restore 之后，断言的是提交态的清单。
      #
      # 与上面那条边界门禁的分工：边界门禁的结论行已被 R 阶段全量回归记录在案，
      # 因此本轮策略是「只约束新增 crate」（决策 c 方案 3），不追溯既有代码，也不
      # 改动那条门禁。所以本门禁的范围由脚本里的显式 TARGET_CRATES 列表决定
      # （当前仅 packages/infra），而不是由 workspace 路径推导。
      #
      # 只禁裸 unwrap()：expect("…") 一律放行（AGENTS.md 禁的是「裸」）。#[cfg(test)]
      # item 与 #[test] / #[tokio::test] 函数按语法整段剔除，不按文件名。目标 crate
      # 缺失、未分类、或一个 .rs 都没读到，都是 error 而不是 pass——「没读」和「没
      # 问题」不允许打印成同一行。
      - name: Shared crate panic policy (PN-01)
        run: pnpm test:shared-crate-panic

      # 计划 :99 的「不同 driver 不共享实现库类型」。F-01 明确放行 driver→driver
      # 边（allowedLayers 含 'driver'），所以上面那道门禁按设计看不见本条；这里补上，
      # 同样不带手写名单——driver 集合由各 crate 源码里是否实现 DatabaseDriver 契约
      # 判定得出，跨 driver 的 Cargo 边 / 源码 use / #[path] 收录三条通道各自独立判定。
      - name: Driver type isolation (T-01..T-03)
        run: pnpm test:driver-types

      # 计划 :269 的 datazen-runtime CI 空缺：core crate 及其后继的 Rust 单测
      # 在此统一执行。crate 集合同样由脚本发现，新增 core crate 无需改 CI。
      - name: Rust unit tests (platform core crates)
        run: pnpm test:platform-crates

      # CM-60 的性能半在这里真跑一次。门禁是这台机器上写进产物的判定式：退出码
      # 0 = 逐轮 p95 与失败数都成立，1 = 判定式不成立，2 = 拒绝在 debug 下跑。
      # 所以 `--release` 不是性能偏好而是硬约束：`cm60-bench/main.rs` 在
      # `debug_assertions` 下直接退 2，用 debug 产物测出来的数一律作废。
      #
      # 4 vCPU / 8589934592 字节是判据锚点（`connection-management.md` CM-60），
      # 显式写全而不是靠默认值：默认值一旦被改动，这条命令的日志仍会自证它
      # 跑的是哪一份计划（产物 plan 段逐字记录）。
      #
      # `--out target/bench` 显式给出：`cargo run` 的工作目录行为不随调用方固定，
      # 写死输出目录才能让下面 upload-artifact 的 glob 一定命中同一批文件。
      #
      # rustc 版本在**运行前**取：产物 build 段要记编译器版本，编完再取就晚了。
      - name: CM-60 latency benchmark (release)
        run: |
          DZ_CM60_RUSTC_VERSION="$(rustc --version)" cargo run --release -p datazen-runtime --bin cm60-bench -- \
            --vcpus 4 --mem-bytes 8589934592 --out target/bench
      # 基准产物不在版本控制里（/target 被 gitignore），不存成 artifact 就等于
      # 没人能复核一次红灯。`if: always()` 是因为上面那步红的时候这一步照样要跑。
      - name: Upload CM-60 benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm60-bench
          path: target/bench/cm60-*.json
          if-no-files-found: warn

      # 门禁自身的变异证明，放最后一步：它会临时改写 Cargo.toml 再还原，
      # 因此后面不得再有依赖该工作树的步骤。最后运行把「被强杀导致残留变异」
      # 的影响面降到 0（此时整个 job 已经没有后续步骤了）。
      # 10 个变异约 5s，失败即说明门禁已经失去鉴别力——比门禁变红更早报警。
      - name: Platform arch guard self-proof (10 mutations)
        run: pnpm test:platform-arch:mutations

  # ── 聚合 job：所有被选中的检查全绿才算 CI 通过。
  # 分支保护的 required status check 盯 `ci` 一个即可，拆分 job 不影响它。
  ci:
    needs: [detect-changes, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected checks passed
        env:
          CHANGES_RESULT: ${{ needs.detect-changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success" || test "$FRONTEND_RESULT" = "skipped"
          test "$RUST_RESULT" = "success" || test "$RUST_RESULT" = "skipped"
