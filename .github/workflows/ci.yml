name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATAZEN_KEYRING: file

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # builtinLocales.ts is git-ignored codegen. Ensure it exists before
      # typecheck (the prepare hook also generates it, but this makes the
      # dependency explicit and covers CI caches that skip prepare).
      - name: Generate built-in locale codegen
        run: node scripts/generate-builtin-locales.mjs

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Guard tracked driver-managed files are not injected
        run: node scripts/check-managed-stubs.mjs

      - name: Guard Host structure caps registry absent
        run: node scripts/check-structure-editor-guardrails.mjs

      - name: Guard ID terminology (connectionId / dbSessionId)
        run: pnpm test:ids

      - name: Guard CI-docs consistency
        run: pnpm test:ci-docs

      - name: Guard i18n sync (warning only)
        run: node scripts/i18n-sync-check.mjs
        continue-on-error: true

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Check site changes
        id: site-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -q '^site/'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Site SEO/i18n checks
        if: steps.site-changes.outputs.site_changed == 'true'
        run: node scripts/check-site-seo.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (Tauri / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Resolve drivers (basic)
        run: node scripts/resolve-drivers.mjs --drivers=basic

      - name: Rust unit tests (driver API)
        run: cargo test -p datazen-driver-api --lib

      - name: Rust unit tests (datazen)
        run: |
          FEATURES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.driver-features.json','utf8')).features.join(','))")
          cargo test -p datazen --lib --features "$FEATURES"

      - name: Rust unit tests (basic path drivers)
        run: cargo test -p datazen-driver-postgres -p datazen-driver-mysql -p datazen-driver-sqlite -p datazen-driver-redis --lib

      - name: Restore managed files
        if: always()
        run: node scripts/driver-file-stash.mjs restore

      - name: Rust unit tests (datazen-ai-api)
        run: cargo test -p datazen-ai-api --lib
