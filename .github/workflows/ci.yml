name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR / ref 连续 push 时，取消仍在跑的旧运行，只保留最新一次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATAZEN_KEYRING: file

jobs:
  # ── 前端段：pnpm → codegen → typecheck → 守卫 → 单测 → site 检查 ──
  # 与 rust job 并行：两者互不依赖（Rust 段不消费 typecheck/单测产物，
  # 前端段不消费 cargo 产物），墙钟时间 = max(前端, Rust) 而非两者之和。
  frontend:
    runs-on: ubuntu-latest

    steps:
      # 全量历史：site SEO/i18n 检查要用 base sha / event.before 做 diff。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # builtinLocales.ts is git-ignored codegen. Ensure it exists before
      # typecheck (the prepare hook also generates it, but this makes the
      # dependency explicit and covers CI caches that skip prepare).
      - name: Generate built-in locale codegen
        run: node scripts/generate-builtin-locales.mjs

      - name: TypeScript typecheck
        run: pnpm typecheck

      # 8 个严格守卫合并为一步：任何失败立即停止（fail-fast），
      # 输出清晰标注哪条命令失败。省掉 7 次 shell launch 开销。
      - name: All strict guards (stubs, caps, IDs, layers, ci-docs, version, boundaries, i18n keys)
        run: |
          node scripts/check-managed-stubs.mjs
          node scripts/check-structure-editor-guardrails.mjs
          pnpm test:ids
          pnpm test:layers
          pnpm test:ci-docs
          pnpm test:version
          pnpm test:boundaries
          pnpm test:i18n-keys

      - name: Guard i18n sync (warning only)
        run: node scripts/i18n-sync-check.mjs
        continue-on-error: true

      - name: Frontend unit tests
        # No Pro here, and no Pro opt-out. `packages/pro-extensions/**` is a
        # path this repository does not own, so every guard below prunes it at
        # the walk (see `SKIP_PATH_PREFIXES` in scripts/lib/scanTargets.mjs) and
        # no test in this suite reads it. There is no seam gate to waive: the
        # cross-repo assertions live in the Pro repo and run in the Pro's CI.

        run: pnpm test:unit

      # Path 驱动 UI 单测（AGENTS.md「驱动测试落点」表）。宿主单测不碰
      # packages/drivers，所以 `pnpm test:unit` 从不收集这些用例；不单独跑一步
      # 就没有任何合并门禁执行它们。放在 codegen（`pretest:unit` 产生的
      # generated.ts）之后、site 检查之前，避开 rust job 里 resolve-drivers 那段。
      - name: Driver UI unit tests
        run: pnpm test:unit:drivers
      # The step above only ever judges `basic`, because that is what
      # `pnpm install`'s prepare hook seeds (ensure-generated-drivers.mjs ->
      # resolve-drivers.mjs default). A driver form `basic` does not register
      # (e.g. `sqlserver`) therefore escapes Host unit coverage entirely.
      # This step re-runs the same suite under `all` (all registered PATH
      # drivers: no git driver, so no deploy key and no network needed).
      # The set lives only in run-unit-driver-set.mjs, never inline here.
      #
      # Status: GREEN, not known-red. An earlier revision of this comment
      # claimed two blockers; both were artifacts of a stale base
      # (7f35e1932, which predates d1edfa7ba / f4c2e5078 by 9 commits) and
      # do not exist on feat/platform-p0 @ 7559759b7. Re-measured there with
      # codegen --drivers=all + generate-builtin-locales:
      #   Test Files 555 passed (555) | Tests 5677 passed (5677), exit 0, 140s
      #   tester_tunnelValidationMatrix.test.tsx alone: 36 passed, exit 0
      # The ContentView / QueryPanel.executeCancel failures named earlier were
      # the ones cbf87a4c0 fixed ("修复 schemaStore/panelStore mock 漂移导致
      # 的 18 个前端单测失败"). Do not reintroduce a blocked list here without
      # re-measuring on the current base.
      #
      # Why still a soft gate, then — a different and much narrower reason:
      # this step and the 10s testTimeout in vitest.config.ts have never
      # executed on a real GitHub runner. A green run on an 8-core dev host is
      # not evidence about a runner whose spec this project does not control.
      # The step reports and does not block so the first CI runs can be
      # observed; promote it to a hard gate (drop continue-on-error) once it is
      # green on several consecutive runs, and update the row in
      # docs/development/ci-test-matrix.md at the same time.
      #
      # COUPLING WARNING: dropping continue-on-error ALSO breaks a guard —
      # scripts/__tests__/run-unit-driver-set.test.ts:149 asserts it is true
      # ("expected undefined to be true"). Promoting this step to a hard gate
      # without editing that assertion turns CI red. The two edits are one
      # change, not two.
      #
      # Timeout budget, measured not guessed (per-test wall time, all 5714
      # tests, --reporter=json):
      #   2 workers, load 13  (a local --maxWorkers=2 low-load run) p95 57ms  p99 170ms  max  1745ms
      #   8 workers, load  7  (mild contention)                    p95 118ms p99 336ms  max  4392ms
      #   8 workers, load 48  (6-7x contention)                    p95 329ms p99 918ms  max 11629ms
      # Vitest's 5s default leaves the load-7 worst case at 88% of budget, so
      # it has no headroom under any further contention. Note testTimeout only fires for
      # tests that yield: in the load-48 run the three slowest tests (11629ms,
      # 6540ms, 5236ms) overran 5s and still passed, and the only real timeout
      # was DataTransferWindow, which awaits. Full derivation in
      # docs/development/ci-test-matrix.md.
      - name: Frontend unit tests (all path drivers)
        run: pnpm test:unit:driver-set
        continue-on-error: true

      - name: Check site changes
        id: site-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -q '^site/'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Site SEO/i18n checks
        if: steps.site-changes.outputs.site_changed == 'true'
        run: node scripts/check-site-seo.mjs

  # ── Rust 段：工具链 → 系统依赖 → rust-cache → 驱动注入 → cargo 测试 ──
  rust:
    runs-on: ubuntu-latest

    steps:
      # 浅克隆即可：basic 预设全是 path 驱动，resolve-drivers 不做 git fetch；
      # 需要全量历史的 site diff 只在 frontend job。
      - uses: actions/checkout@v5

      # resolve-drivers.mjs → resolve-pro.mjs → pack-ep.mjs 顶层 import 了
      # fflate（ESM 静态解析），所以驱动注入同样需要 node_modules。
      # pnpm store 走 setup-node 缓存，这一步开销很小。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (Tauri / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Resolve drivers (basic)
        run: node scripts/resolve-drivers.mjs --drivers=basic

      # driver-api 与四个 path 驱动均不依赖 --features / 注入产物，合并为一次
      # cargo 调用，省掉一次 workspace 加载与锁获取。
      - name: Rust unit tests (driver API + basic path drivers)
        run: cargo test --lib -p datazen-driver-api -p datazen-driver-postgres -p datazen-driver-mysql -p datazen-driver-sqlite -p datazen-driver-redis

      - name: Rust unit tests (datazen)
        run: |
          FEATURES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.driver-features.json','utf8')).features.join(','))")
          cargo test -p datazen --lib --features "$FEATURES"

      - name: Restore managed files
        if: always()
        run: node scripts/driver-file-stash.mjs restore

      - name: Rust unit tests (datazen-ai-api)
        run: cargo test -p datazen-ai-api --lib

  # ── 聚合 job：两段全绿才算 CI 通过。
  # 分支保护的 required status check 盯 `ci` 一个即可，拆分 job 不影响它。
  ci:
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "frontend + rust jobs passed"
