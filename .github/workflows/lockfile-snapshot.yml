name: lockfile-snapshot

# TEMPORARY one-shot helper (WR-D1 follow-up): the sandbox that authored the
# datazen-server skeleton has no cargo toolchain, so Cargo.lock could not be
# refreshed in the same commit. CI auto-updates it on the runner, which leaves
# the worktree dirty and makes the platform-arch mutation self-proof refuse to
# run ("REFUSING TO RUN — the worktree has uncommitted changes: M Cargo.lock").
# This workflow refreshes the lock on a real toolchain and uploads it as an
# artifact; the maintainer downloads it, reviews the diff, and commits it.
# DELETE THIS FILE after the lock lands.

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Resolution only — no compilation. Updates Cargo.lock in place if the
      # manifests are newer than the lock (they are: server/ just joined).
      - name: Refresh Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null

      - name: Report the lock diff
        run: |
          git --no-pager diff --stat Cargo.lock || true

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
