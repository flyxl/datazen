name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Default: no token scopes. Job below opts into contents:write for draft releases.
permissions: {}

# One release at a time. Two overlapping tag pushes would otherwise compile the
# same driver set twice over the same runner pool.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ── Shared release build settings ──
# Builds run on the default `release` Cargo profile: tauri-cli 2.10.1 exposes no
# `--profile` flag (only `--debug` vs release), so a custom Cargo profile cannot
# be selected through `tauri build` at all.
#
# DATAZEN_CI_TYPECHECK_ONCE=1 drops `tsc --noEmit` from the per-variant frontend
# build: `union-typecheck` typechecks the union driver set once, which is a
# strict superset of what each variant would have checked.
env:
  DATAZEN_KEYRING: file
  DATAZEN_CI_TYPECHECK_ONCE: '1'

jobs:
  # Build + sign the SQL Editor Pro extension ONCE and hand it to every variant
  # as an artifact. Doing it here rather than inside each matrix job means one
  # clone/build instead of eleven, and it drops the need for a PAT able to read
  # the private Pro repo's releases. Release policy since v0.2.3: the extension
  # tracks the Pro repo's default-branch HEAD (pro-extension.lock.json `ref` is
  # null) — Pro main is the branch whose manifest declares the host's current
  # EXTENSION_POINTS_VERSION, so a pinned older revision would be refused by
  # checkEngineCompatibility at runtime. Pass --pro-ref / DATAZEN_PRO_REF to
  # reproduce an old release with a fixed extension revision.
  prepare-pro-extension:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup SSH for the private Pro extension repo
        shell: bash
        env:
          PRO_DEPLOY_KEY: ${{ secrets.PRO_DEPLOY_KEY || secrets.SQL_EDITOR_PRO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRO_DEPLOY_KEY:-}" ]; then
            echo "::error::PRO_DEPLOY_KEY is not set — cannot clone the private Pro extension"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$PRO_DEPLOY_KEY" > ~/.ssh/datazen_pro
          chmod 600 ~/.ssh/datazen_pro
          printf '%s\n' \
            'Host github.com-pro' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/datazen_pro' \
            '  IdentitiesOnly yes' \
            >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "https://github.com/flyxl/datazen-extension-sql-editor-pro.git"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone, build and sign the Pro extension from the default branch
        run: node scripts/resolve-pro.mjs --edition=pro

      # The .dzx is a signed, platform-independent package built from the Pro
      # source checkout, so it is produced here rather than in the one matrix
      # job that used to clone the repo just to pack it.
      - name: Pack the signed Pro .dzx
        shell: bash
        run: |
          mkdir -p artifacts
          node scripts/pack-ep.mjs \
            --extension=sql-editor-pro \
            --mode=dzx \
            --skip-build \
            --out=artifacts/
          ls -la artifacts/*.dzx
        env:
          DATAZEN_EP_SIGNING_PRIVATE_KEY: ${{ secrets.DATAZEN_EP_SIGNING_PRIVATE_KEY }}

      - name: Upload the staged Pro extension
        uses: actions/upload-artifact@v4
        with:
          name: pro-extension
          path: src-tauri/resources/builtin-ep/sql-editor-pro
          if-no-files-found: error
          retention-days: 1

      - name: Upload the signed Pro .dzx
        uses: actions/upload-artifact@v4
        with:
          name: pro-dzx
          path: artifacts/*.dzx
          if-no-files-found: error
          retention-days: 1

  # ── Driver union warmup: compile every driver ONCE per target ──
  # The union typecheck, once, on a single runner.
  #
  # The build matrix skips `tsc --noEmit` via DATAZEN_CI_TYPECHECK_ONCE=1, so
  # this is the only thing standing between a release and a driver set that does
  # not typecheck — it gates `build` for that reason. It is target independent,
  # so one runner covers all four (platform, target) pairs.
  #
  # Dropping this job would put `tsc` back inside all 11 variant jobs: the wall
  # clock would not improve (every job would just be T_tsc slower, and the
  # longest leg sets the run's finish time), but runner-minutes would go UP by
  # 10x T_tsc and coverage would drop from the union down to per-variant.
  union-typecheck:
    runs-on: ubuntu-22.04
    # Deploy Keys for the private git drivers live in Environment "release" —
    # kiwi and superset are part of the union this job has to typecheck.
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup SSH for private git drivers
        shell: bash
        env:
          KIWI_DEPLOY_KEY: ${{ secrets.KIWI_DEPLOY_KEY }}
          SUPERSET_DEPLOY_KEY: ${{ secrets.SUPERSET_DEPLOY_KEY }}
        run: bash scripts/ci-setup-git-drivers.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck the driver union
        run: node scripts/with-driver-inject.mjs --drivers=all,kiwi,superset -- node scripts/ci-union-typecheck.mjs

  build:
    # Secrets (Deploy Keys, Windows signing) live in Environment "release"
    # — see docs/development/ci-private-drivers.md
    needs: [prepare-pro-extension, union-typecheck]
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── DataZen (Basic)：默认发行版（4 核心原生驱动 + SQL Editor 增强）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            variant: "basic"
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            variant: "basic"
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            variant: "basic"
            needs_git: false
            needs_pro: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            variant: "basic"
            needs_git: false
            needs_pro: true
          # ── DataZen (All)：全原生驱动版（全部原生驱动 + SQL Editor 增强）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            variant: "all"
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            variant: "all"
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            variant: "all"
            needs_git: false
            needs_pro: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            variant: "all"
            needs_git: false
            needs_pro: true
          # ── Akulaku：定制驱动部署（全核心 + MongoDB + Kiwi + Superset + Pro；仅 Windows / macOS）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            edition: "pro"
            variant_suffix: "-akulaku"
            variant: "akulaku"
            needs_git: true
            needs_pro: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            edition: "pro"
            variant_suffix: "-akulaku"
            variant: "akulaku"
            needs_git: true
            needs_pro: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            edition: "pro"
            variant_suffix: "-akulaku"
            variant: "akulaku"
            needs_git: true
            needs_pro: true

    runs-on: ${{ matrix.platform }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps (Tauri / webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            desktop-file-utils

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ${{ matrix.target }}
          # Retain workspace driver artifacts alongside dependency artifacts.
          # Cargo checks fingerprints and rebuilds changed inputs/features.
          # Every variant saves: actions/cache keeps one entry per key, so the
          # job that finishes last wins and the others' save is a no-op. That is
          # the same race a dedicated warmup used to lose deterministically, but
          # the entry it produced was never read — all 11 build jobs already
          # restored a warm closure from the previous run (see §6.1).
          cache-workspace-crates: true
          cache-on-failure: true

      # Git-driver & Pro extension SKUs: read-only Deploy Keys for private repos.
      # Public key exposure is harmless; private keys must stay in Environment secrets.
      # Do NOT rely on webfactory/ssh-agent comment→repo mapping: keys commented
      # `datazen-ci-*` are not auto-mapped, so GitHub accepts only the first key and
      # the second private repo fails with "Repository not found".
      - name: Setup SSH for private plugins & pro extensions
        if: matrix.needs_git || matrix.needs_pro
        shell: bash
        env:
          KIWI_DEPLOY_KEY: ${{ secrets.KIWI_DEPLOY_KEY }}
          SUPERSET_DEPLOY_KEY: ${{ secrets.SUPERSET_DEPLOY_KEY }}
          PRO_DEPLOY_KEY: ${{ secrets.PRO_DEPLOY_KEY || secrets.SQL_EDITOR_PRO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          touch ~/.ssh/config
          chmod 600 ~/.ssh/config

          if [ -n "${KIWI_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$KIWI_DEPLOY_KEY" > ~/.ssh/datazen_kiwi
            chmod 600 ~/.ssh/datazen_kiwi
            printf '%s\n' \
              'Host github.com-kiwi' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/datazen_kiwi' \
              '  IdentitiesOnly yes' \
              >> ~/.ssh/config
            git config --global --unset-all url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf || true
            git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "https://github.com/flyxl/datazen-driver-kiwi.git"
            git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "https://github.com/flyxl/datazen-driver-kiwi"
            git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "git@github.com:flyxl/datazen-driver-kiwi.git"
          fi

          if [ -n "${SUPERSET_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$SUPERSET_DEPLOY_KEY" > ~/.ssh/datazen_superset
            chmod 600 ~/.ssh/datazen_superset
            printf '%s\n' \
              'Host github.com-superset' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/datazen_superset' \
              '  IdentitiesOnly yes' \
              >> ~/.ssh/config
            git config --global --unset-all url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf || true
            git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "https://github.com/flyxl/datazen-driver-superset.git"
            git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "https://github.com/flyxl/datazen-driver-superset"
            git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "git@github.com:flyxl/datazen-driver-superset.git"
          fi

          if [ -n "${PRO_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$PRO_DEPLOY_KEY" > ~/.ssh/datazen_pro
            chmod 600 ~/.ssh/datazen_pro
            printf '%s\n' \
              'Host github.com-pro' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/datazen_pro' \
              '  IdentitiesOnly yes' \
              >> ~/.ssh/config
            git config --global --unset-all url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf || true
            git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "https://github.com/flyxl/datazen-extension-sql-editor-pro.git"
            git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "https://github.com/flyxl/datazen-extension-sql-editor-pro"
            git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "git@github.com:flyxl/datazen-extension-sql-editor-pro.git"
          fi

          git config --global --get-regexp '^url\..*\.insteadof$' || true
          # Smoke-test rewrite (does not need network auth for ls-remote if config wrong — fail early).
          echo "GIT_SSH rewrite smoke: $(git config --get-regexp 'url\..*(kiwi|superset|sql-editor-pro).*insteadof' | tr '\n' ' ' || true)"

      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Path certificate/certificate.pfx
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install

      - name: Configure updater signing (every SKU)
        # Every SKU publishes its own signed channel (latest.json /
        # latest-all.json / latest-akulaku.json). Gating this on the Basic
        # variant — as it was — left -all / -akulaku with no signed artifacts at
        # all, so the only manifest they could reach was Basic's: an in-app
        # update silently replaced the variant with Basic and dropped the extra
        # drivers. The signing key is shared, and the pubkey compiled into
        # tauri.conf.json is identical across SKUs, so one key signs them all.
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI signing key present — updater artifacts will be generated for variant '${{ matrix.variant }}'"
            echo "UPDATER_BUILD=1" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — skipping updater artifact generation for variant '${{ matrix.variant }}'"
            echo "UPDATER_BUILD=0" >> "$GITHUB_ENV"
          fi

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx --no-progress

      - name: Download the Pro extension built once for every variant
        if: matrix.needs_pro
        uses: actions/download-artifact@v4
        with:
          name: pro-extension
          path: src-tauri/resources/builtin-ep/sql-editor-pro

      - name: Resolve drivers and build Tauri app
        shell: bash
        run: |
          UPDATER_FLAG=""
          if [ "${UPDATER_BUILD}" = "1" ]; then
            UPDATER_FLAG="--updater"
          fi
          EDITION_FLAG=""
          if [ "${{ matrix.edition }}" = "pro" ]; then
            EDITION_FLAG="--edition=pro"
          fi
          # The signed Pro extension is already staged under builtin-ep from the
          # prepare-pro-extension artifact, so resolve-pro uses it verbatim.
          node scripts/with-driver-inject.mjs --drivers="${{ matrix.drivers }}" --variant="${{ matrix.variant }}" ${EDITION_FLAG} -- node scripts/ci-tauri-build.mjs --target=${{ matrix.target }} ${UPDATER_FLAG} ${EDITION_FLAG}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATAZEN_DRIVERS: ${{ matrix.drivers }}
          DATAZEN_EDITION: ${{ matrix.edition || 'community' }}
          # Release SKU: baked into the frontend codegen (so the runtime updater
          # gate and the compiled endpoint agree) and used to pick the endpoint.
          DATAZEN_VARIANT: ${{ matrix.variant }}
          DATAZEN_EP_SIGNING_PRIVATE_KEY: ${{ secrets.DATAZEN_EP_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Pro extension is bundled in app
        if: matrix.needs_pro
        shell: bash
        run: |
          # Note: with-driver-inject.mjs restores staging dirs after the child command,
          # so src-tauri/resources/builtin-ep/ may already be cleared here.
          # We verify the actual bundled output instead.
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          FAIL=0

          # ── macOS: check .app bundle ──
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR=$(find "$BUNDLE_DIR/macos" -name "*.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_DIR" ]; then
              echo "::error::macOS .app bundle not found in $BUNDLE_DIR/macos"
              ls -la "$BUNDLE_DIR/macos/" 2>/dev/null || echo "(no macOS bundle dir)"
              FAIL=1
            elif [ -f "$APP_DIR/Contents/Resources/builtin-ep/sql-editor-pro/dist/index.esm.js" ]; then
              echo "✓ Pro extension found in macOS .app: $APP_DIR"
              ls -la "$APP_DIR/Contents/Resources/builtin-ep/sql-editor-pro/"
            else
              echo "::error::Pro extension (builtin-ep) not found in macOS .app bundle"
              echo "Contents of $APP_DIR/Contents/Resources/:"
              ls -laR "$APP_DIR/Contents/Resources/" 2>/dev/null | head -40
              FAIL=1
            fi
          fi

          # ── Linux: check deb + AppImage ──
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "::notice::[pro-verify] staging state before check:"
            ls -la src-tauri/resources/builtin-ep/sql-editor-pro/dist/ 2>/dev/null || echo "::notice::[pro-verify] staging dir already restored (expected)"

            DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" 2>/dev/null | head -1)
            if [ -z "$DEB" ]; then
              echo "::error::Linux deb package not found in $BUNDLE_DIR/deb"
              FAIL=1
            else
              # Cache dpkg-deb listing once — avoids re-running for each check
              # and prevents bash 3.2 pipeline exit-code issues with grep -q.
              DEB_LISTING=$(dpkg-deb -c "$DEB" 2>/dev/null || true)
              echo "$DEB_LISTING" | grep "builtin-ep/sql-editor-pro" | head -10
              if echo "$DEB_LISTING" | grep -q "builtin-ep/sql-editor-pro/dist/index.esm.js"; then
                echo "✓ Pro extension found in Linux deb: $DEB"
              else
                echo "::error::Pro extension (builtin-ep) not found in Linux deb package"
                echo "::notice::[pro-verify] deb entries with 'builtin-ep':"
                echo "$DEB_LISTING" | grep -i "builtin-ep" || echo "::notice::[pro-verify] (no builtin-ep entries)"
                FAIL=1
              fi
            fi

            # AppImage is a squashfs dump of the same resource tree — check it too.
            APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" 2>/dev/null | head -1)
            if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then
              chmod +x "$APPIMAGE" 2>/dev/null || true
              if "$APPIMAGE" --appimage-extract "usr/lib/*/resources/builtin-ep/sql-editor-pro/dist/index.esm.js" >/dev/null 2>&1; then
                echo "✓ Pro extension found in Linux AppImage"
                rm -rf squashfs-root
              else
                echo "::notice::[pro-verify] builtin-ep not confirmed in AppImage (extraction probe failed)"
                rm -rf squashfs-root
              fi
            fi
          fi

          # ── Windows: NSIS installer check (portable is verified in its own step) ──
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "ℹ Windows portable archive is verified in the dedicated packaging step."
          fi

          exit $FAIL

      # The AppImage catalog (appimage.github.io) runs appdir-lint on the mounted
      # AppImage and FATALs when `.DirIcon` is missing. tauri-bundler creates
      # `.DirIcon`, the root icon and the root .desktop symlink in the AppDir, but
      # the linuxdeploy build pinned by the bundler strips them while repacking
      # (observed with tauri-bundler 2.10.0 + linuxdeploy 07333c6) — so re-inject
      # them and repack with appimagetool. The repack invalidates the updater
      # signature, hence the re-sign below.
      - name: Fix AppDir conventions in the Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::no AppImage found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          bash scripts/fix-appimage-appdir.sh "$APPIMAGE"

          # Repack invalidated the `.sig` produced during `tauri build` — re-sign
          # so latest.json keeps verifying against the updater pubkey.
          if [ "${UPDATER_BUILD}" = "1" ]; then
            PASS_ARGS=()
            if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
              PASS_ARGS=(-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
            fi
            pnpm exec tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "${PASS_ARGS[@]}" "$APPIMAGE"
          fi
        env:
          BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.variant_suffix == '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Download the signed Pro .dzx (Default Pro, once)
        if: matrix.needs_pro && matrix.variant_suffix == '' && matrix.os_label == 'linux-x64'
        uses: actions/download-artifact@v4
        with:
          name: pro-dzx
          path: artifacts/

      # ── Windows portable: includes runtime resources (prompts + Pro builtin-ep) ──
      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path "target/${{ matrix.target }}" "release"
          $executable = Join-Path $releaseDir "datazen.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            $executable = Join-Path $releaseDir "DataZen.exe"
          }
          $prompts = Join-Path $releaseDir "prompts"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Portable executable not found: $executable"
          }
          if (-not (Test-Path -LiteralPath $prompts -PathType Container)) {
            throw "Portable resources not found: $prompts"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "datazen-portable"
          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item -LiteralPath $executable -Destination (Join-Path $stageDir "DataZen.exe")
          Copy-Item -LiteralPath $prompts -Destination (Join-Path $stageDir "prompts") -Recurse

          # Include Pro extension resources (builtin-ep) for full feature parity with installers.
          $builtinEp = Join-Path $releaseDir "builtin-ep"
          if (Test-Path -LiteralPath $builtinEp -PathType Container) {
            Copy-Item -LiteralPath $builtinEp -Destination (Join-Path $stageDir "builtin-ep") -Recurse
            Write-Host "Included builtin-ep (Pro extensions) in portable archive"
          } else {
            Write-Warning "builtin-ep directory not found at $builtinEp — portable archive will not include Pro extensions"
          }

          # Keep future adjacent runtime libraries with the portable executable.
          Get-ChildItem -LiteralPath $releaseDir -File -Filter "*.dll" | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stageDir
          }

          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $osLabel = "${{ matrix.os_label }}"
          $variant = "${{ matrix.variant_suffix }}"
          $variantTrimmed = $variant.TrimStart('-')
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          if ($variantTrimmed) {
            $archive = Join-Path "artifacts" "DataZen-$version-$osLabel-portable-$variantTrimmed.zip"
          } else {
            $archive = Join-Path "artifacts" "DataZen-$version-$osLabel-portable.zip"
          }
          # 7-Zip ships on GitHub's Windows runners and compresses a ~150 MB
          # staged tree in a fraction of the time Compress-Archive takes
          # (its Deflate "Optimal" pass is the slow part of this step).
          # Compress-Archive stays as the fallback so the step never depends
          # on 7-Zip being present.
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          # $archive is relative (the upload step globs "artifacts/*.zip"), so
          # resolve it before changing the working directory below.
          $archiveFull = [System.IO.Path]::GetFullPath($archive)
          if (Test-Path -LiteralPath $sevenZip) {
            Push-Location $stageDir
            try {
              & $sevenZip a -tzip -mx=5 -bd $archiveFull ".\\*" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } else {
            Write-Warning "7-Zip not found — falling back to Compress-Archive (slower)"
            Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $archive -CompressionLevel Optimal -Force
          }
          Write-Host "Created portable archive: $archive"

      # ── Canonical artifact naming: DataZen-{Version}-{Platform}-{Arch}[-{Variant}].{ext} ──
      - name: Rename artifacts with canonical names
        shell: bash
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          VERSION=$(node -p "require('./package.json').version")
          OS_LABEL="${{ matrix.os_label }}"
          VARIANT="${{ matrix.variant_suffix }}"
          VARIANT="${VARIANT#-}"          # strip leading hyphen
          PLATFORM="${OS_LABEL%%-*}"      # macos / windows / linux
          ARCH="${OS_LABEL#*-}"           # arm64 / x64

          mkdir -p artifacts

          installer_type() {
            local name="$1"
            case "$name" in
              *.app.tar.gz) echo "tar" ;;
              *.tar.gz)     echo "tar" ;;
              *.dmg)        echo "dmg" ;;
              *.exe)        echo "nsis" ;;
              *.AppImage)   echo "appimage" ;;
              *.deb)        echo "deb" ;;
              *.rpm)        echo "rpm" ;;
              *)            echo "" ;;
            esac
          }

          file_ext() {
            local name="$1"
            case "$name" in
              *.app.tar.gz) echo "tar.gz" ;;
              *.tar.gz)     echo "tar.gz" ;;
              *.dmg)        echo "dmg" ;;
              *.exe)        echo "exe" ;;
              *.AppImage)   echo "AppImage" ;;
              *.deb)        echo "deb" ;;
              *.rpm)        echo "rpm" ;;
              *)            echo "" ;;
            esac
          }

          canonical_name() {
            local ext="$1"
            # AppImage catalog convention: the file name must not contain
            # "linux" (every AppImage is for Linux) and spells the arch
            # x86_64/aarch64 — e.g. DataZen-1.2.3-x86_64.AppImage. All other
            # artifacts keep the DataZen-{Version}-{Platform}-{Arch} scheme.
            if [ "$ext" = "AppImage" ]; then
              local appimage_arch="$ARCH"
              case "$ARCH" in
                x64)   appimage_arch="x86_64" ;;
                arm64) appimage_arch="aarch64" ;;
              esac
              if [ -n "$VARIANT" ]; then
                echo "DataZen-${VERSION}-${appimage_arch}-${VARIANT}.${ext}"
              else
                echo "DataZen-${VERSION}-${appimage_arch}.${ext}"
              fi
              return
            fi
            if [ -n "$VARIANT" ]; then
              echo "DataZen-${VERSION}-${PLATFORM}-${ARCH}-${VARIANT}.${ext}"
            else
              echo "DataZen-${VERSION}-${PLATFORM}-${ARCH}.${ext}"
            fi
          }

          shopt -s nullglob

          # Process non-sig files first, writing a mapping file for sig resolution
          # (avoids bash 4+ associative arrays which break on macOS bash 3.2)
          MAPPING_FILE=$(mktemp)
          for file in \
            "$BUNDLE_DIR"/dmg/*.dmg \
            "$BUNDLE_DIR"/macos/*.tar.gz \
            "$BUNDLE_DIR"/nsis/*.exe \
            "$BUNDLE_DIR"/deb/*.deb \
            "$BUNDLE_DIR"/rpm/*.rpm \
            "$BUNDLE_DIR"/appimage/*.AppImage; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            type=$(installer_type "$base")
            ext=$(file_ext "$base")
            [ -z "$type" ] && continue

            newbase=$(canonical_name "$ext")
            echo "${base}=${newbase}" >> "$MAPPING_FILE"
            cp "$file" "artifacts/$newbase"
            echo "  $base → $newbase"
          done

          # Process sig files (must follow their main file's new name)
          for file in \
            "$BUNDLE_DIR"/macos/*.sig \
            "$BUNDLE_DIR"/nsis/*.sig \
            "$BUNDLE_DIR"/appimage/*.sig; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            sigstem="${base%.sig}"

            # Look up the mapping via grep (works on bash 3.2)
            newbase=$(grep "^${sigstem}=" "$MAPPING_FILE" 2>/dev/null | head -1 | cut -d= -f2-)

            if [ -z "$newbase" ]; then
              ext=$(file_ext "$sigstem")
              [ -z "$ext" ] && { echo "  SKIP unrecognized sig: $base"; continue; }
              newbase="$(canonical_name "$ext")"
            fi

            cp "$file" "artifacts/${newbase}.sig"
            echo "  $base → ${newbase}.sig"
          done

          rm -f "$MAPPING_FILE"
          ls -la artifacts/ || true

      # Tauri's DMG config has no `contents` field, so a file cannot be placed
      # inside the DMG window at build time. We inject the first-launch note
      # here instead. The read-write convert round-trip is deliberate: it
      # preserves the window layout (icon positions live in the .DS_Store of
      # the volume), which rebuilding from a staged copy would throw away.
      - name: Add first-launch README to macOS DMGs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          README="packaging/macos/README-安装说明.md"
          [ -f "$README" ] || { echo "::error::$README not found"; exit 1; }

          shopt -s nullglob
          DMGS=(artifacts/*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "No DMG artifacts in this job (expected for non-macOS variants) — skipping."
            exit 0
          fi

          for dmg in "${DMGS[@]}"; do
            work=$(mktemp -d)
            rw="$work/rw.dmg"
            out="$work/out.dmg"
            mnt="$work/mnt"
            mkdir -p "$mnt"

            hdiutil convert "$dmg" -format UDRW -o "$rw" -quiet
            hdiutil attach "$rw" -nobrowse -mountpoint "$mnt" -quiet

            if [ -e "$mnt/$(basename "$README")" ]; then
              echo "::warning::README already present in $(basename "$dmg") — replacing"
            fi
            cp "$README" "$mnt/"

            # Detach with a flush so the new file is committed to the volume
            # before we convert it back to a compressed read-only image.
            hdiutil detach "$mnt" -quiet
            # `hdiutil convert` has no -ov and refuses an existing destination,
            # so it must not write back to the same path it read from.
            hdiutil convert "$rw" -format UDZO -o "$out" -quiet
            mv -f "$out" "$dmg"
            rm -rf "$work"

            # Prove the injection landed rather than trusting the exit code.
            if hdiutil imageinfo "$dmg" >/dev/null 2>&1; then
              echo "✓ $(basename "$dmg") rebuilt with first-launch README"
            else
              echo "::error::rebuilt DMG is unreadable: $dmg"
              exit 1
            fi
          done

      - name: Resolve release notes file
        id: release-notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"            # e.g. v0.2.2
          VERSION="${TAG#v}"                  # e.g. 0.2.2
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          # Per-release prose is promotional material and is NOT committed (it lives
          # in the local, gitignored `posts/`). The release body is therefore the
          # matching CHANGELOG.md section — the only committed source of truth.
          awk -v ver="${VERSION//./\\.}" '
            $0 ~ "^## \\[" ver "\\]"  { found=1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "✅ Release body from CHANGELOG.md [$VERSION]"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "⚠️ No CHANGELOG.md section for [$VERSION], falling back to auto-generated notes"
          fi

      - name: Upload artifacts to release
        # v3 runs on Node 24 (v2 is Node 20 and breaks under FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
        # with "self-signed certificate / --use-system-ca" when talking to the GitHub API).
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/*
          body_path: ${{ steps.release-notes.outputs.path || '' }}
          generate_release_notes: ${{ steps.release-notes.outputs.path == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-updater-json:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --dir assets --clobber
          ls -la assets/

      - name: Generate and upload updater manifests (one per SKU)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # One manifest per release SKU. The Tauri updater resolves an entry by
          # platform only, so a shared manifest means every variant is offered
          # Basic's bundle: an `-all` / `-akulaku` user would be silently
          # downgraded to Basic and lose the drivers Basic does not ship.
          # Basic is first and uploaded on its own so a variant problem can never
          # stall the channel every existing install already points at.
          for VARIANT in basic all akulaku; do
            MANIFEST=$(node -e 'import("./scripts/release-variants.mjs").then((m) => process.stdout.write(m.manifestNameForVariant(process.argv[1]) ?? ""))' "$VARIANT")
            if [ -z "$MANIFEST" ]; then
              echo "::error::release variant '$VARIANT' has no manifest name"
              exit 1
            fi
            echo "── $VARIANT → $MANIFEST ──"
            node scripts/generate-updater-latest-json.mjs \
              --assets-dir assets \
              --version "$VERSION" \
              --tag "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes "DataZen ${GITHUB_REF_NAME}" \
              --variant "$VARIANT" \
              --out "$MANIFEST"
            cat "$MANIFEST"
            gh release upload "${GITHUB_REF_NAME}" "$MANIFEST" --clobber
          done

  release-checksums:
    needs: [build, release-updater-json]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          # Draft releases are still addressable by tag; GH_REPO avoids needing a checkout.
          gh release download "${GITHUB_REF_NAME}" --dir assets --clobber
          ls -la assets/

      - name: Compute SHA256 for Basic release artifacts
        id: checksums
        shell: bash
        run: |
          {
            echo "## Basic release checksums (SHA256)"
            echo ""
            echo "For Homebrew / WinGet templates in \`packaging/\`. Excludes \`-all\` and \`-akulaku\` variants."
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
          } > checksums.md

          found=0
          for f in assets/*; do
            base=$(basename "$f")
            # Skip variant builds, signatures, and non-installer files.
            # Screaming the SKU is not enough on its own: the suffix lands in
            # different places. `…-macos-arm64-all.tar.gz` and
            # `…-windows-x64-all.exe` end in `-all.`, while the Windows portable
            # `…-windows-x64-portable-all.zip` also ends in `-all.` but never
            # contains `-all-`. The old `*-all-*` glob therefore matched nothing
            # and let every variant through into the Basic table, whose whole
            # purpose is to be pasted into Homebrew / WinGet. Both spellings are
            # kept so a naming change on either side cannot reintroduce the leak.
            case "$base" in
              *-all-*|*-all.*) continue ;;
              *-akulaku-*|*-akulaku.*) continue ;;
              *.sig|latest.json|latest-*.json|*.dzx) continue ;;
            esac
            # Match on the canonical names emitted by the rename step above,
            # which is `<ext>`-based: the Windows installer is
            # `…-windows-x64.exe`, not `…-windows-x64-nsis.exe` (`installer_type`
            # gates eligibility but never enters the name), so the previous
            # `*-windows-*-nsis.exe` alternative silently dropped the one
            # artifact WinGet needs. AppImages are matched by extension alone:
            # the AppImage catalog rejects "linux" in the file name, so the
            # rename step gives them no platform segment.
            case "$base" in
              *-macos-*.dmg|*-macos-*.tar.gz|*-windows-*.exe|*-windows-*-portable.zip|*-linux-*.deb|*-linux-*.rpm|*.AppImage)
                sha=$(sha256sum "$f" | awk '{print $1}')
                echo "| \`$base\` | \`$sha\` |" >> checksums.md
                found=$((found + 1))
                ;;
            esac
          done

          if [ "$found" -eq 0 ]; then
            echo "| _(no Basic installers matched yet)_ | |" >> checksums.md
          fi

          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          cat checksums.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Append checksums to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          marker="## Basic release checksums (SHA256)"
          if echo "$existing" | grep -qF "$marker"; then
            echo "$existing" | awk -v marker="$marker" '
              { if ($0 ~ marker) { skip=1 } else if (skip && /^## /) { skip=0 } if (!skip) print }
            ' > /tmp/release-body.md
          else
            echo "$existing" > /tmp/release-body.md
          fi
          printf '\n\n' >> /tmp/release-body.md
          cat checksums.md >> /tmp/release-body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-body.md
