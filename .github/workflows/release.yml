name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Default: no token scopes. Job below opts into contents:write for draft releases.
permissions: {}

jobs:
  build:
    # Secrets (Deploy Keys, Windows signing) live in Environment "release"
    # — see docs/development/ci-private-plugins.md
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Basic：四核心 path 驱动 ──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "basic"
            variant_suffix: ""
            needs_git: false
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "basic"
            variant_suffix: ""
            needs_git: false
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "basic"
            variant_suffix: ""
            needs_git: false
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "basic"
            variant_suffix: ""
            needs_git: false
          # ── All：全部 path 原生驱动（不含 kiwi / superset / olap）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "all"
            variant_suffix: "-all"
            needs_git: false
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "all"
            variant_suffix: "-all"
            needs_git: false
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "all"
            variant_suffix: "-all"
            needs_git: false
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "all"
            variant_suffix: "-all"
            needs_git: false
          # ── Akulaku：CI 显式列表（非 resolve-drivers 预设）──
          # basic + mongodb + kiwi + superset
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            variant_suffix: "-akulaku"
            needs_git: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            variant_suffix: "-akulaku"
            needs_git: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            variant_suffix: "-akulaku"
            needs_git: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            variant_suffix: "-akulaku"
            needs_git: true

    runs-on: ${{ matrix.platform }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps (Tauri / webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      # Git-driver SKUs only: read-only Deploy Keys for private plugin repos.
      # Public key exposure is harmless; private keys must stay in Environment secrets.
      # Do NOT rely on webfactory/ssh-agent comment→repo mapping: keys commented
      # `datazen-ci-*` are not auto-mapped, so GitHub accepts only the first key and
      # the second private repo fails with "Repository not found".
      - name: Setup SSH for private plugins
        if: matrix.needs_git
        shell: bash
        env:
          KIWI_DEPLOY_KEY: ${{ secrets.KIWI_DEPLOY_KEY }}
          SUPERSET_DEPLOY_KEY: ${{ secrets.SUPERSET_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          printf '%s\n' "$KIWI_DEPLOY_KEY" > ~/.ssh/datazen_kiwi
          printf '%s\n' "$SUPERSET_DEPLOY_KEY" > ~/.ssh/datazen_superset
          chmod 600 ~/.ssh/datazen_kiwi ~/.ssh/datazen_superset

          printf '%s\n' \
            'Host github.com-kiwi' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/datazen_kiwi' \
            '  IdentitiesOnly yes' \
            'Host github.com-superset' \
            '  HostName github.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/datazen_superset' \
            '  IdentitiesOnly yes' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # drivers-registry.json keeps https:// URLs; rewrite per-repo to the
          # Host alias that selects the matching deploy key.
          # Use --add: a second insteadOf without --add overwrites the first.
          git config --global --unset-all url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf || true
          git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "https://github.com/flyxl/datazen-driver-kiwi.git"
          git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "https://github.com/flyxl/datazen-driver-kiwi"
          git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "git@github.com:flyxl/datazen-driver-kiwi.git"
          git config --global --unset-all url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf || true
          git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "https://github.com/flyxl/datazen-driver-superset.git"
          git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "https://github.com/flyxl/datazen-driver-superset"
          git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "git@github.com:flyxl/datazen-driver-superset.git"
          git config --global --get-regexp '^url\..*\.insteadof$' || true
          # Smoke-test rewrite (does not need network auth for ls-remote if config wrong — fail early).
          echo "GIT_SSH rewrite smoke: $(git config --get-regexp 'url\..*kiwi.*insteadof' | tr '\n' ' ')"

      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Path certificate/certificate.pfx
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install

      - name: Configure updater signing (Basic only)
        if: matrix.variant_suffix == ''
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI signing key present — updater artifacts will be generated"
            echo "UPDATER_BUILD=1" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — skipping updater artifact generation for Basic build"
            echo "UPDATER_BUILD=0" >> "$GITHUB_ENV"
          fi

      - name: Resolve drivers and build Tauri app
        shell: bash
        run: |
          UPDATER_FLAG=""
          if [ "${UPDATER_BUILD}" = "1" ]; then
            UPDATER_FLAG="--updater"
          fi
          node scripts/with-driver-inject.mjs --drivers="${{ matrix.drivers }}" -- node scripts/ci-tauri-build.mjs --target=${{ matrix.target }} ${UPDATER_FLAG}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATAZEN_DRIVERS: ${{ matrix.drivers }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.variant_suffix == '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts with platform and variant label
        shell: bash
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          LABEL="${{ matrix.os_label }}${{ matrix.variant_suffix }}"
          mkdir -p artifacts

          shopt -s nullglob
          for file in \
            "$BUNDLE_DIR"/dmg/*.dmg \
            "$BUNDLE_DIR"/macos/*.tar.gz \
            "$BUNDLE_DIR"/macos/*.sig \
            "$BUNDLE_DIR"/nsis/*.exe \
            "$BUNDLE_DIR"/nsis/*.sig \
            "$BUNDLE_DIR"/msi/*.msi \
            "$BUNDLE_DIR"/msi/*.sig \
            "$BUNDLE_DIR"/deb/*.deb \
            "$BUNDLE_DIR"/rpm/*.rpm \
            "$BUNDLE_DIR"/appimage/*.AppImage \
            "$BUNDLE_DIR"/appimage/*.sig; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            if [[ "$base" == *.sig ]]; then
              # Signature files must follow their bundle's renamed name so the
              # updater latest.json generator can resolve "<bundle>.<ext>.sig".
              sigstem="${base%.sig}"
              if [[ "$sigstem" == *.tar.gz ]]; then
                inner="${sigstem%.tar.gz}"
                newsigstem="${inner}-${LABEL}.tar.gz"
              elif [[ "$sigstem" == *.AppImage ]]; then
                inner="${sigstem%.AppImage}"
                newsigstem="${inner}-${LABEL}.AppImage"
              else
                inner="${sigstem%.*}"
                ext="${sigstem##*.}"
                newsigstem="${inner}-${LABEL}.${ext}"
              fi
              newname="${newsigstem}.sig"
            elif [[ "$base" == *.tar.gz ]]; then
              stem="${base%.tar.gz}"
              newname="${stem}-${LABEL}.tar.gz"
            elif [[ "$base" == *.AppImage ]]; then
              stem="${base%.AppImage}"
              newname="${stem}-${LABEL}.AppImage"
            else
              stem="${base%.*}"
              ext="${base##*.}"
              newname="${stem}-${LABEL}.${ext}"
            fi
            cp "$file" "artifacts/$newname"
          done
          ls -la artifacts/ || true

      - name: Upload artifacts to release
        # v3 runs on Node 24 (v2 is Node 20 and breaks under FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
        # with "self-signed certificate / --use-system-ca" when talking to the GitHub API).
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/*
          body: |
            ## 版本说明

            本次发布包含三个安装包变体（按需选用，不为大而全买单）：

            - **Basic**（无后缀）：PostgreSQL、MySQL、SQLite、Redis — 默认推荐，体积最小
            - **All**（文件名含 `-all`）：全部 **path 原生驱动**（MongoDB、SQL Server、ClickHouse、DuckDB 等；**不含** Kiwi / Superset / OLAP）
            - **Akulaku**（文件名含 `-akulaku`）：Basic + MongoDB + Kiwi + Superset（面向特定部署）

            源码构建可进一步裁剪：`DATAZEN_DRIVERS=postgres,mongodb` 等显式列表，只编译需要的类型。

            ## 安装说明

            ### macOS
            由于应用未经过 Apple 公证，首次打开时可能提示"已损坏"或"无法验证"。请按以下步骤操作：

            1. 安装应用后，打开终端运行：
               ```
               xattr -cr /Applications/DataZen.app
               ```
            2. 然后正常打开应用即可。

            或者：右键点击应用 → 选择"打开" → 在弹出的对话框中点击"打开"。

            ### Windows
            直接运行 `.exe` 安装包或 `.msi` 安装包即可。

            ### Linux (x86_64)
            - **AppImage**：`chmod +x *.AppImage` 后直接运行（部分发行版需安装 `libfuse2`）
            - **deb**：`sudo apt install ./DataZen-*-linux-x64.deb`
            - **rpm**：`sudo rpm -i ./DataZen-*-linux-x64.rpm`（或发行版对应的包管理器）
            运行时依赖 WebKitGTK（常见包名：`libwebkit2gtk-4.1-0` / `webkit2gtk4.1`）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-updater-json:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --dir assets --clobber
          ls -la assets/

      - name: Generate and upload latest.json (Basic updater)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-updater-latest-json.mjs \
            --assets-dir assets \
            --version "$VERSION" \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes "DataZen ${GITHUB_REF_NAME}" \
            --out latest.json
          cat latest.json
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber

  release-checksums:
    needs: [build, release-updater-json]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          # Draft releases are still addressable by tag; GH_REPO avoids needing a checkout.
          gh release download "${GITHUB_REF_NAME}" --dir assets --clobber
          ls -la assets/

      - name: Compute SHA256 for Basic installers
        id: checksums
        shell: bash
        run: |
          {
            echo "## Basic installer checksums (SHA256)"
            echo ""
            echo "For Homebrew / WinGet templates in \`packaging/\`. Excludes \`-all\` and \`-akulaku\` variants."
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
          } > checksums.md

          found=0
          for f in assets/*; do
            base=$(basename "$f")
            case "$base" in
              *-all.*|*-akulaku.*) continue ;;
              *.sig|latest.json) continue ;;
            esac
            case "$base" in
              *-macos-arm64.dmg|*-macos-x64.dmg|*-windows-x64.exe|*-windows-x64.msi|*-linux-x64.deb|*-linux-x64.rpm|*-linux-x64.AppImage)
                sha=$(sha256sum "$f" | awk '{print $1}')
                echo "| \`$base\` | \`$sha\` |" >> checksums.md
                found=$((found + 1))
                ;;
            esac
          done

          if [ "$found" -eq 0 ]; then
            echo "| _(no Basic installers matched yet)_ | |" >> checksums.md
          fi

          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          cat checksums.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Append checksums to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          marker="## Basic installer checksums (SHA256)"
          if echo "$existing" | grep -qF "$marker"; then
            echo "$existing" | awk -v marker="$marker" '
              { if ($0 ~ marker) { skip=1 } else if (skip && /^## /) { skip=0 } if (!skip) print }
            ' > /tmp/release-body.md
          else
            echo "$existing" > /tmp/release-body.md
          fi
          printf '\n\n' >> /tmp/release-body.md
          cat checksums.md >> /tmp/release-body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-body.md
