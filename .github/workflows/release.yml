name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Default: no token scopes. Job below opts into contents:write for draft releases.
permissions: {}

jobs:
  build:
    # Secrets (Deploy Keys, Windows signing) live in Environment "release"
    # — see docs/ci-private-plugins.md
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 基础版（仅内置驱动：PostgreSQL, MySQL, SQLite, Redis）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            plugins: "none"
            variant_suffix: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            plugins: "none"
            variant_suffix: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            plugins: "none"
            variant_suffix: ""
          # ── Pro 版（内置驱动 + Kiwi + Superset）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            plugins: "kiwi,superset"
            variant_suffix: "-pro"
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            plugins: "kiwi,superset"
            variant_suffix: "-pro"
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            plugins: "kiwi,superset"
            variant_suffix: "-pro"

    runs-on: ${{ matrix.platform }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      # Pro matrix only: read-only Deploy Keys for private plugin repos.
      # Public key exposure is harmless; private keys must stay in Environment secrets.
      - name: Setup SSH agent for private plugins
        if: matrix.plugins != 'none'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.KIWI_DEPLOY_KEY }}
            ${{ secrets.SUPERSET_DEPLOY_KEY }}

      - name: Configure git to clone GitHub over SSH
        if: matrix.plugins != 'none'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          # plugins-registry.json keeps https:// URLs; rewrite to SSH for auth.
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Path certificate/certificate.pfx
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install

      - name: Resolve plugins and build Tauri app
        shell: bash
        run: |
          # Inject once; beforeBuildCommand `pnpm build` only runs tsc/vite.
          # Use ci-tauri-build.mjs (not bash -c) so Windows Node spawn keeps args.
          node scripts/with-plugin-inject.mjs --plugins="${{ matrix.plugins }}" -- node scripts/ci-tauri-build.mjs --target=${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATAZEN_PLUGINS: ${{ matrix.plugins }}

      - name: Rename artifacts with platform and variant label
        shell: bash
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          LABEL="${{ matrix.os_label }}${{ matrix.variant_suffix }}"
          mkdir -p artifacts

          shopt -s nullglob
          for file in \
            "$BUNDLE_DIR"/dmg/*.dmg \
            "$BUNDLE_DIR"/nsis/*.exe \
            "$BUNDLE_DIR"/msi/*.msi; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            if [[ "$base" == *.tar.gz ]]; then
              stem="${base%.tar.gz}"
              newname="${stem}-${LABEL}.tar.gz"
            else
              stem="${base%.*}"
              ext="${base##*.}"
              newname="${stem}-${LABEL}.${ext}"
            fi
            cp "$file" "artifacts/$newname"
          done
          ls -la artifacts/ || true

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          body: |
            ## 版本说明

            本次发布包含两个版本：
            - **基础版**：内置 PostgreSQL、MySQL、SQLite、Redis 驱动
            - **Pro 版**（文件名含 `-pro`）：额外包含 **Kiwi** 云数据库代理与 **Superset** 数据探索插件（不含 OLAP Presto/Trino；需 `DATAZEN_PLUGINS=all` 或 `--plugins=olap` 单独启用）

            ## 安装说明

            ### macOS
            由于应用未经过 Apple 公证，首次打开时可能提示"已损坏"或"无法验证"。请按以下步骤操作：

            1. 安装应用后，打开终端运行：
               ```
               xattr -cr /Applications/DataZen.app
               ```
            2. 然后正常打开应用即可。

            或者：右键点击应用 → 选择"打开" → 在弹出的对话框中点击"打开"。

            ### Windows
            直接运行 `.exe` 安装包或 `.msi` 安装包即可。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
