name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Default: no token scopes. Job below opts into contents:write for draft releases.
permissions: {}

jobs:
  build:
    # Secrets (Deploy Keys, Windows signing) live in Environment "release"
    # — see docs/development/ci-private-plugins.md
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── DataZen (Basic)：默认发行版（4 核心原生驱动 + SQL Editor 增强）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            needs_git: false
            needs_pro: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "basic"
            edition: "pro"
            variant_suffix: ""
            needs_git: false
            needs_pro: true
          # ── DataZen (All)：全原生驱动版（全部原生驱动 + SQL Editor 增强）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            needs_git: false
            needs_pro: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            needs_git: false
            needs_pro: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_label: linux-x64
            drivers: "all"
            edition: "pro"
            variant_suffix: "-all"
            needs_git: false
            needs_pro: true
          # ── Akulaku：定制驱动部署（全核心 + MongoDB + Kiwi + Superset + Pro；仅 Windows / macOS）──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            edition: "pro"
            variant_suffix: "-akulaku"
            needs_git: true
            needs_pro: true
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_label: macos-arm64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            edition: "pro"
            variant_suffix: "-akulaku"
            needs_git: true
            needs_pro: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_label: macos-x64
            drivers: "postgres,mysql,sqlite,redis,mongodb,kiwi,superset"
            edition: "pro"
            variant_suffix: "-akulaku"
            needs_git: true
            needs_pro: true

    runs-on: ${{ matrix.platform }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps (Tauri / webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      # Git-driver & Pro extension SKUs: read-only Deploy Keys for private repos.
      # Public key exposure is harmless; private keys must stay in Environment secrets.
      # Do NOT rely on webfactory/ssh-agent comment→repo mapping: keys commented
      # `datazen-ci-*` are not auto-mapped, so GitHub accepts only the first key and
      # the second private repo fails with "Repository not found".
      - name: Setup SSH for private plugins & pro extensions
        if: matrix.needs_git || matrix.needs_pro
        shell: bash
        env:
          KIWI_DEPLOY_KEY: ${{ secrets.KIWI_DEPLOY_KEY }}
          SUPERSET_DEPLOY_KEY: ${{ secrets.SUPERSET_DEPLOY_KEY }}
          PRO_DEPLOY_KEY: ${{ secrets.PRO_DEPLOY_KEY || secrets.SQL_EDITOR_PRO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          touch ~/.ssh/config
          chmod 600 ~/.ssh/config

          if [ -n "${KIWI_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$KIWI_DEPLOY_KEY" > ~/.ssh/datazen_kiwi
            chmod 600 ~/.ssh/datazen_kiwi
            printf '%s\n' \
              'Host github.com-kiwi' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/datazen_kiwi' \
              '  IdentitiesOnly yes' \
              >> ~/.ssh/config
            git config --global --unset-all url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf || true
            git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "https://github.com/flyxl/datazen-driver-kiwi.git"
            git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "https://github.com/flyxl/datazen-driver-kiwi"
            git config --global --add url."git@github.com-kiwi:flyxl/datazen-driver-kiwi.git".insteadOf "git@github.com:flyxl/datazen-driver-kiwi.git"
          fi

          if [ -n "${SUPERSET_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$SUPERSET_DEPLOY_KEY" > ~/.ssh/datazen_superset
            chmod 600 ~/.ssh/datazen_superset
            printf '%s\n' \
              'Host github.com-superset' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/datazen_superset' \
              '  IdentitiesOnly yes' \
              >> ~/.ssh/config
            git config --global --unset-all url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf || true
            git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "https://github.com/flyxl/datazen-driver-superset.git"
            git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "https://github.com/flyxl/datazen-driver-superset"
            git config --global --add url."git@github.com-superset:flyxl/datazen-driver-superset.git".insteadOf "git@github.com:flyxl/datazen-driver-superset.git"
          fi

          if [ -n "${PRO_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$PRO_DEPLOY_KEY" > ~/.ssh/datazen_pro
            chmod 600 ~/.ssh/datazen_pro
            printf '%s\n' \
              'Host github.com-pro' \
              '  HostName github.com' \
              '  User git' \
              '  IdentityFile ~/.ssh/datazen_pro' \
              '  IdentitiesOnly yes' \
              >> ~/.ssh/config
            git config --global --unset-all url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf || true
            git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "https://github.com/flyxl/datazen-extension-sql-editor-pro.git"
            git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "https://github.com/flyxl/datazen-extension-sql-editor-pro"
            git config --global --add url."git@github.com-pro:flyxl/datazen-extension-sql-editor-pro.git".insteadOf "git@github.com:flyxl/datazen-extension-sql-editor-pro.git"
          fi

          git config --global --get-regexp '^url\..*\.insteadof$' || true
          # Smoke-test rewrite (does not need network auth for ls-remote if config wrong — fail early).
          echo "GIT_SSH rewrite smoke: $(git config --get-regexp 'url\..*(kiwi|superset|sql-editor-pro).*insteadof' | tr '\n' ' ' || true)"

      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Path certificate/certificate.pfx
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install

      - name: Configure updater signing (Default Pro only)
        if: matrix.variant_suffix == ''
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI signing key present — updater artifacts will be generated"
            echo "UPDATER_BUILD=1" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — skipping updater artifact generation for Pro build"
            echo "UPDATER_BUILD=0" >> "$GITHUB_ENV"
          fi

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx --no-progress

      - name: Download prebuilt Pro extension (fast path)
        if: matrix.needs_pro
        shell: bash
        env:
          PRO_DEPLOY_KEY: ${{ secrets.PRO_DEPLOY_KEY || secrets.SQL_EDITOR_PRO_DEPLOY_KEY }}
          PRO_PREBUILT_TOKEN: ${{ secrets.PRO_PREBUILT_TOKEN }}
        run: |
          # Attempt to download the prebuilt pro extension tarball from the
          # Pro repo's GitHub Release.  This avoids cloning + building from
          # source — no SSH deploy key needed for the Pro repo itself.
          # The Pro repo is private: pass a fine-grained PAT (releases:read on
          # the Pro repo) as the `PRO_PREBUILT_TOKEN` environment secret.
          VERSION=$(node -p "require('./package.json').version")
          PRO_REPO="flyxl/datazen-extension-sql-editor-pro"
          TAG="pro-${VERSION}"
          TARBALL="sql-editor-pro-${VERSION}.tar.gz"
          URL="https://github.com/${PRO_REPO}/releases/download/${TAG}/${TARBALL}"

          echo "Trying prebuilt: ${URL}"

          # Token precedence: dedicated PRO_PREBUILT_TOKEN > GITHUB_TOKEN.
          # Note: GITHUB_TOKEN belongs to the host repo and cannot read the
          # private Pro repo's releases — without PRO_PREBUILT_TOKEN the
          # download is expected to 404 and fall back to source build.
          PREBUILT_TOKEN="${PRO_PREBUILT_TOKEN:-${GITHUB_TOKEN:-}}"

          # Private-repo release assets cannot be fetched via the browser
          # redirect URL with a Bearer token (CDN returns 404). Resolve the
          # asset via the API and download with Accept: application/octet-stream.
          ASSET_URL=""
          if [ -n "$PREBUILT_TOKEN" ]; then
            ASSET_URL=$(curl -fsSL -H "Authorization: Bearer ${PREBUILT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${PRO_REPO}/releases/tags/${TAG}" \
              2>/dev/null | node -e "
                let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try{
                    const j=JSON.parse(s);
                    const a=(j.assets||[]).find(x=>x.name==='${TARBALL}');
                    if(a&&a.url)console.log(a.url);
                  }catch{}
                });" || true)
          fi

          if [ -n "$ASSET_URL" ]; then
            curl_args=(-fsSL -H "Authorization: Bearer ${PREBUILT_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o "/tmp/${TARBALL}" "${ASSET_URL}")
          elif [ -n "$PREBUILT_TOKEN" ]; then
            # API lookup failed — try the browser URL as a last resort (public repos).
            curl_args=(-fsSL -H "Authorization: Bearer ${PREBUILT_TOKEN}" -o "/tmp/${TARBALL}" "${URL}")
          else
            curl_args=(-fsSL -o "/tmp/${TARBALL}" "${URL}")
          fi

          if curl "${curl_args[@]}" 2>/tmp/prebuilt-curl.err; then
            mkdir -p src-tauri/resources/builtin-ep/sql-editor-pro
            tar -xzf "/tmp/${TARBALL}" -C src-tauri/resources/builtin-ep/sql-editor-pro
            rm -f "/tmp/${TARBALL}"

            # Verify required files
            if [ -f "src-tauri/resources/builtin-ep/sql-editor-pro/manifest.json" ] && \
               [ -f "src-tauri/resources/builtin-ep/sql-editor-pro/dist/index.esm.js" ]; then
              echo "✅ Prebuilt pro extension downloaded and extracted"
              echo "PRO_PREBUILT_URL=${URL}" >> "$GITHUB_ENV"
              # Also set for resolve-pro.mjs
              echo "DATAZEN_PRO_PREBUILT_URL=${URL}" >> "$GITHUB_ENV"
            else
              echo "::notice::Prebuilt tarball missing required files, falling back to source build"
            fi
          else
            HTTP_HINT=$(head -c 200 /tmp/prebuilt-curl.err 2>/dev/null || echo "download failed")
            echo "::notice::Prebuilt download failed (${HTTP_HINT}), falling back to source build"
          fi
          rm -f /tmp/prebuilt-curl.err

      - name: Resolve drivers and build Tauri app
        shell: bash
        run: |
          UPDATER_FLAG=""
          if [ "${UPDATER_BUILD}" = "1" ]; then
            UPDATER_FLAG="--updater"
          fi
          EDITION_FLAG=""
          if [ "${{ matrix.edition }}" = "pro" ]; then
            EDITION_FLAG="--edition=pro"
          fi
          PRO_PREBUILT_FLAG=""
          if [ -n "${PRO_PREBUILT_URL:-}" ]; then
            PRO_PREBUILT_FLAG="--pro-prebuilt-url=${PRO_PREBUILT_URL}"
          fi
          node scripts/with-driver-inject.mjs --drivers="${{ matrix.drivers }}" ${EDITION_FLAG} ${PRO_PREBUILT_FLAG} -- node scripts/ci-tauri-build.mjs --target=${{ matrix.target }} ${UPDATER_FLAG} ${EDITION_FLAG}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATAZEN_DRIVERS: ${{ matrix.drivers }}
          DATAZEN_EDITION: ${{ matrix.edition || 'community' }}
          DATAZEN_EP_SIGNING_PRIVATE_KEY: ${{ secrets.DATAZEN_EP_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.variant_suffix == '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Pro extension is bundled in app
        if: matrix.needs_pro
        shell: bash
        run: |
          # Note: with-driver-inject.mjs restores staging dirs after the child command,
          # so src-tauri/resources/builtin-ep/ may already be cleared here.
          # We verify the actual bundled output instead.
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          FAIL=0

          # ── macOS: check .app bundle ──
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR=$(find "$BUNDLE_DIR/macos" -name "*.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_DIR" ]; then
              echo "::error::macOS .app bundle not found in $BUNDLE_DIR/macos"
              ls -la "$BUNDLE_DIR/macos/" 2>/dev/null || echo "(no macOS bundle dir)"
              FAIL=1
            elif [ -f "$APP_DIR/Contents/Resources/builtin-ep/sql-editor-pro/dist/index.esm.js" ]; then
              echo "✓ Pro extension found in macOS .app: $APP_DIR"
              ls -la "$APP_DIR/Contents/Resources/builtin-ep/sql-editor-pro/"
            else
              echo "::error::Pro extension (builtin-ep) not found in macOS .app bundle"
              echo "Contents of $APP_DIR/Contents/Resources/:"
              ls -laR "$APP_DIR/Contents/Resources/" 2>/dev/null | head -40
              FAIL=1
            fi
          fi

          # ── Linux: check deb + AppImage ──
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "::notice::[pro-verify] staging state before check:"
            ls -la src-tauri/resources/builtin-ep/sql-editor-pro/dist/ 2>/dev/null || echo "::notice::[pro-verify] staging dir already restored (expected)"

            DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" 2>/dev/null | head -1)
            if [ -z "$DEB" ]; then
              echo "::error::Linux deb package not found in $BUNDLE_DIR/deb"
              FAIL=1
            else
              # Cache dpkg-deb listing once — avoids re-running for each check
              # and prevents bash 3.2 pipeline exit-code issues with grep -q.
              DEB_LISTING=$(dpkg-deb -c "$DEB" 2>/dev/null || true)
              echo "$DEB_LISTING" | grep "builtin-ep/sql-editor-pro" | head -10
              if echo "$DEB_LISTING" | grep -q "builtin-ep/sql-editor-pro/dist/index.esm.js"; then
                echo "✓ Pro extension found in Linux deb: $DEB"
              else
                echo "::error::Pro extension (builtin-ep) not found in Linux deb package"
                echo "::notice::[pro-verify] deb entries with 'builtin-ep':"
                echo "$DEB_LISTING" | grep -i "builtin-ep" || echo "::notice::[pro-verify] (no builtin-ep entries)"
                FAIL=1
              fi
            fi

            # AppImage is a squashfs dump of the same resource tree — check it too.
            APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" 2>/dev/null | head -1)
            if [ -n "$APPIMAGE" ] && [ -f "$APPIMAGE" ]; then
              chmod +x "$APPIMAGE" 2>/dev/null || true
              if "$APPIMAGE" --appimage-extract "usr/lib/*/resources/builtin-ep/sql-editor-pro/dist/index.esm.js" >/dev/null 2>&1; then
                echo "✓ Pro extension found in Linux AppImage"
                rm -rf squashfs-root
              else
                echo "::notice::[pro-verify] builtin-ep not confirmed in AppImage (extraction probe failed)"
                rm -rf squashfs-root
              fi
            fi
          fi

          # ── Windows: NSIS installer check (portable is verified in its own step) ──
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "ℹ Windows portable archive is verified in the dedicated packaging step."
          fi

          exit $FAIL

      - name: Pack signed SQL Editor Pro .dzx (Default Pro, once)
        if: matrix.needs_pro && matrix.variant_suffix == '' && matrix.os_label == 'linux-x64'
        shell: bash
        run: |
          mkdir -p artifacts
          node scripts/pack-ep.mjs \
            --extension=sql-editor-pro \
            --mode=dzx \
            --skip-build \
            --out=artifacts/
          ls -la artifacts/*.dzx
        env:
          DATAZEN_EP_SIGNING_PRIVATE_KEY: ${{ secrets.DATAZEN_EP_SIGNING_PRIVATE_KEY }}

      # ── Windows portable: includes runtime resources (prompts + Pro builtin-ep) ──
      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path "target/${{ matrix.target }}" "release"
          $executable = Join-Path $releaseDir "datazen.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            $executable = Join-Path $releaseDir "DataZen.exe"
          }
          $prompts = Join-Path $releaseDir "prompts"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Portable executable not found: $executable"
          }
          if (-not (Test-Path -LiteralPath $prompts -PathType Container)) {
            throw "Portable resources not found: $prompts"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "datazen-portable"
          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item -LiteralPath $executable -Destination (Join-Path $stageDir "DataZen.exe")
          Copy-Item -LiteralPath $prompts -Destination (Join-Path $stageDir "prompts") -Recurse

          # Include Pro extension resources (builtin-ep) for full feature parity with installers.
          $builtinEp = Join-Path $releaseDir "builtin-ep"
          if (Test-Path -LiteralPath $builtinEp -PathType Container) {
            Copy-Item -LiteralPath $builtinEp -Destination (Join-Path $stageDir "builtin-ep") -Recurse
            Write-Host "Included builtin-ep (Pro extensions) in portable archive"
          } else {
            Write-Warning "builtin-ep directory not found at $builtinEp — portable archive will not include Pro extensions"
          }

          # Keep future adjacent runtime libraries with the portable executable.
          Get-ChildItem -LiteralPath $releaseDir -File -Filter "*.dll" | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stageDir
          }

          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $osLabel = "${{ matrix.os_label }}"
          $variant = "${{ matrix.variant_suffix }}"
          $variantTrimmed = $variant.TrimStart('-')
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          if ($variantTrimmed) {
            $archive = Join-Path "artifacts" "DataZen-$version-$osLabel-portable-$variantTrimmed.zip"
          } else {
            $archive = Join-Path "artifacts" "DataZen-$version-$osLabel-portable.zip"
          }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $archive -CompressionLevel Optimal -Force
          Write-Host "Created portable archive: $archive"

      # ── Canonical artifact naming: DataZen-{Version}-{Platform}-{Arch}[-{Variant}]-{Type}.{ext} ──
      - name: Rename artifacts with canonical names
        shell: bash
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          VERSION=$(node -p "require('./package.json').version")
          OS_LABEL="${{ matrix.os_label }}"
          VARIANT="${{ matrix.variant_suffix }}"
          VARIANT="${VARIANT#-}"          # strip leading hyphen
          PLATFORM="${OS_LABEL%%-*}"      # macos / windows / linux
          ARCH="${OS_LABEL#*-}"           # arm64 / x64

          mkdir -p artifacts

          installer_type() {
            local name="$1"
            case "$name" in
              *.app.tar.gz) echo "tar" ;;
              *.tar.gz)     echo "tar" ;;
              *.dmg)        echo "dmg" ;;
              *.exe)        echo "nsis" ;;
              *.AppImage)   echo "appimage" ;;
              *.deb)        echo "deb" ;;
              *.rpm)        echo "rpm" ;;
              *)            echo "" ;;
            esac
          }

          file_ext() {
            local name="$1"
            case "$name" in
              *.app.tar.gz) echo "tar.gz" ;;
              *.tar.gz)     echo "tar.gz" ;;
              *.dmg)        echo "dmg" ;;
              *.exe)        echo "exe" ;;
              *.AppImage)   echo "AppImage" ;;
              *.deb)        echo "deb" ;;
              *.rpm)        echo "rpm" ;;
              *)            echo "" ;;
            esac
          }

          canonical_name() {
            local type="$1"
            local ext="$2"
            # Avoid duplicate type+ext (e.g. dmg.dmg, deb.deb, rpm.rpm, appimage.AppImage)
            local label
            if [ "$(echo "$type" | tr '[:upper:]' '[:lower:]')" = "$(echo "$ext" | tr '[:upper:]' '[:lower:]')" ]; then
              label="$ext"
            else
              label="${type}.${ext}"
            fi
            if [ -n "$VARIANT" ]; then
              echo "DataZen-${VERSION}-${PLATFORM}-${ARCH}-${VARIANT}-${label}"
            else
              echo "DataZen-${VERSION}-${PLATFORM}-${ARCH}-${label}"
            fi
          }

          shopt -s nullglob

          # Process non-sig files first, writing a mapping file for sig resolution
          # (avoids bash 4+ associative arrays which break on macOS bash 3.2)
          MAPPING_FILE=$(mktemp)
          for file in \
            "$BUNDLE_DIR"/dmg/*.dmg \
            "$BUNDLE_DIR"/macos/*.tar.gz \
            "$BUNDLE_DIR"/nsis/*.exe \
            "$BUNDLE_DIR"/deb/*.deb \
            "$BUNDLE_DIR"/rpm/*.rpm \
            "$BUNDLE_DIR"/appimage/*.AppImage; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            type=$(installer_type "$base")
            ext=$(file_ext "$base")
            [ -z "$type" ] && continue

            newbase=$(canonical_name "$type" "$ext")
            echo "${base}=${newbase}" >> "$MAPPING_FILE"
            cp "$file" "artifacts/$newbase"
            echo "  $base → $newbase"
          done

          # Process sig files (must follow their main file's new name)
          for file in \
            "$BUNDLE_DIR"/macos/*.sig \
            "$BUNDLE_DIR"/nsis/*.sig \
            "$BUNDLE_DIR"/appimage/*.sig; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            sigstem="${base%.sig}"

            # Look up the mapping via grep (works on bash 3.2)
            newbase=$(grep "^${sigstem}=" "$MAPPING_FILE" 2>/dev/null | head -1 | cut -d= -f2-)

            if [ -z "$newbase" ]; then
              type=$(installer_type "$sigstem")
              ext=$(file_ext "$sigstem")
              [ -z "$type" ] && { echo "  SKIP unrecognized sig: $base"; continue; }
              newbase="$(canonical_name "$type" "$ext")"
            fi

            cp "$file" "artifacts/${newbase}.sig"
            echo "  $base → ${newbase}.sig"
          done

          rm -f "$MAPPING_FILE"
          ls -la artifacts/ || true

      - name: Upload artifacts to release
        # v3 runs on Node 24 (v2 is Node 20 and breaks under FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
        # with "self-signed certificate / --use-system-ca" when talking to the GitHub API).
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/*
          body: |
            ## DataZen v0.2.0

            ### 🇨🇳 中文

            基于 **Tauri v2 + Rust + React** 构建的轻量跨平台数据库桌面客户端，自 v0.1.2 以来累计 **493** 次提交。

            ### ✨ 重点新功能

            **🚀 首次运行引导向导（Onboarding Wizard）**
            3 步快速上手：连接示例数据库 → 探索 AI 辅助 → 开始使用。内置 SQLite 示例库，支持 8 种语言，引导进度可恢复。

            **🎯 SQL 编辑器 4 模式执行策略**
            - **Run Current**（默认）：基于 AST 自动识别光标所在单条 SQL，只执行该句
            - **Run Selection**：仅执行鼠标高亮选中的代码块
            - **Run All**：执行完整批处理或多段 DDL
            - **Ask**：每次执行前弹出策略确认窗

            **⚡ Paste as IN 批量导入**（`Cmd+Shift+V` / `Ctrl+Shift+V`）
            从表格或日志复制多行 ID，在 `IN ()` 内一键格式化为 `'a', 'b', 'c'` 格式。

            **🛑 高危执行拦截**
            - 无 WHERE 的 UPDATE/DELETE 自动弹出红色警告弹窗，要求二次确认
            - 占位符未填值时直接拦截，防止隐式 NULL 导致全表更新

            **✨ SQL Snippets 管理**
            设置页自定义代码片段，实时注入编辑器补全。

            **🔧 工具栏溢出菜单**
            Query Toolbar 重构为 4 个功能区，窄屏自动折叠为溢出下拉菜单。

            **📐 Schema Diff DAG 拓扑排序**
            基于外键依赖构建有向无环图，按 `主表 → 从表 → 外键 → 索引` 严格顺序生成 DDL。各驱动通过 `SchemaMigrationRenderer` trait 声明方言特定的 DDL 渲染逻辑。

            **🔌 Extension Points（扩展点）热插拔**
            运行时加载 SQL Editor Pro 扩展（表结构悬浮预览、外键 JOIN 补全、函数签名帮助等），CodeMirror Compartment 动态重组。扩展包支持签名验证防篡改。

            **🌙 暗色主题全面刷新**
            全站暗色主题 Token 重构，亮色主题微调，统一使用语义 Token。

            **🌐 i18n 领域包架构**
            拆分为 14 个领域包，子窗口按需惰性加载，减少首屏 JS 体积。全端 8 语言翻译同步完成。

            **🏗️ 四维扩展体系**
            Driver（编译时数据库驱动）/ Theme（外观主题）/ EP（运行时扩展点）/ Wapp（Workspace App），为插件商店生态奠定基础。

            **🧠 AI 多模型支持**
            同时支持 OpenAI、Anthropic、DeepSeek、Ollama 及自定义端点。本地模型放宽上下文限制，公网模型自动脱敏。SQL 错误一键带入 AI 诊断。

            **📊 查询结果快速转图表**
            结果集一键切换为折线图、柱状图、饼图、散点图，支持 PNG/SVG 导出。

            **🗄️ 内置原生 Redis 驱动**
            Key 树浏览、命令行交互、实时 Monitor、Pub/Sub 订阅发布。

            **🔐 安全加固**
            IPC 错误自动脱敏（密码、Token、文件路径）；SQL Guard 增强，只读模式下注释中的写操作也被识别。

            ---

            ### 🇬🇧 English

            A lightweight, cross-platform desktop database client built with **Tauri v2 + Rust + React**, with **493** commits since v0.1.2.

            ### ✨ Highlights

            **🚀 Onboarding Wizard**
            3-step guided first run: connect sample DB → explore AI → start working. Built-in SQLite sample DB, 8 languages, resumable progress.

            **🎯 SQL Editor 4 Execution Modes**
            - **Run Current** (default): AST-based single statement execution at cursor position
            - **Run Selection**: execute only highlighted code block
            - **Run All**: execute full script or multiple DDL statements
            - **Ask**: prompt for confirmation before each execution

            **⚡ Paste as IN** (`Cmd+Shift+V` / `Ctrl+Shift+V`)
            One-click format multiple lines of IDs into `IN ('a', 'b', 'c')` syntax.

            **🛑 Dangerous Execution Guard**
            - Auto-popup warning for UPDATE/DELETE without WHERE clause, requiring confirmation
            - Blocks unbound parameters to prevent accidental NULL propagation

            **✨ SQL Snippets Management**
            Custom code snippets in Settings, injected into editor autocomplete in real-time.

            **🔧 Toolbar Overflow Menu**
            Query Toolbar restructured into 4 functional zones with auto-collapsing overflow dropdown on narrow screens.

            **📐 Schema Diff with DAG Topology**
            Foreign-key-aware directed acyclic graph ordering: `tables → foreign keys → indexes`. Drivers declare dialect-specific DDL via `SchemaMigrationRenderer` trait.

            **🔌 Extension Points Hot-Plug**
            Runtime SQL Editor Pro extensions (hover previews, FK JOIN completion, signature help), CodeMirror Compartment dynamic reconfiguration, package signature verification.

            **🌙 Dark Theme Overhaul**
            Full dark theme token refresh, light theme refinement, unified semantic `--color-accent-*` tokens.

            **🌐 i18n Domain Packs**
            14 domain packs with lazy loading for sub-windows, reducing initial JS bundle. 8 languages fully synced.

            **🏗️ Four-Dimensional Extension System**
            Driver (compile-time DB drivers) / Theme (visual themes) / EP (runtime extension points) / Wapp (Workspace Apps) — plugin ecosystem foundation.

            **🧠 Multi-Model AI Support**
            OpenAI, Anthropic, DeepSeek, Ollama, and custom endpoints. Local models get relaxed context; public models auto-masked. One-click SQL error diagnosis.

            **📊 Query Result to Chart**
            One-click switch between line, bar, pie, scatter charts with PNG/SVG export.

            **🗄️ Built-in Redis Driver**
            Key tree browsing, CLI, real-time Monitor, Pub/Sub.

            **🔐 Security Hardening**
            IPC error auto-masking (passwords, tokens, file paths); SQL Guard enhanced to catch write verbs in comments.

            ---

            ### 📦 Variants
            - **DataZen (Basic)** (recommended): 4 core drivers (PostgreSQL, MySQL, SQLite, Redis) + SQL Editor Pro
            - **DataZen (All)** (`-all` suffix): all native drivers + SQL Editor Pro
            - **Akulaku** (`-akulaku` suffix, Windows/macOS only): DataZen + custom drivers (Kiwi, Superset)

            ---

            ## 安装说明 / Installation

            ### macOS
            > The app is not Apple-notarized. After installation, run in Terminal:
            > ```
            > xattr -cr /Applications/DataZen.app
            > ```
            > Or: right-click the app → Open → confirm in the dialog.

            ### Windows
            - **NSIS installer**: run `DataZen-*-windows-x64-nsis.exe` and follow prompts
            - **Portable**: unzip `DataZen-*-windows-x64-portable.zip`, run `DataZen.exe` directly

            ### Linux (x86_64)
            - **AppImage**: `chmod +x DataZen-*.AppImage` then run (may need `libfuse2`)
            - **deb**: `sudo apt install ./DataZen-*-linux-x64.deb`
            - **rpm**: `sudo rpm -i ./DataZen-*-linux-x64.rpm`
            - Runtime dependency: WebKitGTK (`libwebkit2gtk-4.1-0` / `webkit2gtk4.1`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-updater-json:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --dir assets --clobber
          ls -la assets/

      - name: Generate and upload latest.json (Basic updater)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-updater-latest-json.mjs \
            --assets-dir assets \
            --version "$VERSION" \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes "DataZen ${GITHUB_REF_NAME}" \
            --out latest.json
          cat latest.json
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber

  release-checksums:
    needs: [build, release-updater-json]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          # Draft releases are still addressable by tag; GH_REPO avoids needing a checkout.
          gh release download "${GITHUB_REF_NAME}" --dir assets --clobber
          ls -la assets/

      - name: Compute SHA256 for Basic release artifacts
        id: checksums
        shell: bash
        run: |
          {
            echo "## Basic release checksums (SHA256)"
            echo ""
            echo "For Homebrew / WinGet templates in \`packaging/\`. Excludes \`-all\` and \`-akulaku\` variants."
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
          } > checksums.md

          found=0
          for f in assets/*; do
            base=$(basename "$f")
            # Skip variant builds, signatures, and non-installer files
            case "$base" in
              *-all-*) continue ;;
              *-akulaku-*) continue ;;
              *.sig|latest.json|*.dzx) continue ;;
            esac
            case "$base" in
              *-macos-*.dmg|*-macos-*.tar.gz|*-windows-*-nsis.exe|*-windows-*-portable.zip|*-linux-*.deb|*-linux-*.rpm|*-linux-*.AppImage)
                sha=$(sha256sum "$f" | awk '{print $1}')
                echo "| \`$base\` | \`$sha\` |" >> checksums.md
                found=$((found + 1))
                ;;
            esac
          done

          if [ "$found" -eq 0 ]; then
            echo "| _(no Basic installers matched yet)_ | |" >> checksums.md
          fi

          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          cat checksums.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Append checksums to release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          marker="## Basic release checksums (SHA256)"
          if echo "$existing" | grep -qF "$marker"; then
            echo "$existing" | awk -v marker="$marker" '
              { if ($0 ~ marker) { skip=1 } else if (skip && /^## /) { skip=0 } if (!skip) print }
            ' > /tmp/release-body.md
          else
            echo "$existing" > /tmp/release-body.md
          fi
          printf '\n\n' >> /tmp/release-body.md
          cat checksums.md >> /tmp/release-body.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-body.md
