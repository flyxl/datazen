name: Rune UI

on:
  push:
    branches: [feat/rune-native-ui-migration]
    paths:
      - .gitmodules
      - vendor/rune
      - Cargo.toml
      - Cargo.lock
      - crates/datazen-ui/**
      - scripts/build-rune-ui-web.sh
      - packages/web/src/main.tsx
      - packages/web/src/rune-ui.ts
      - packages/web/package.json
      - .github/workflows/rune-ui.yml
  pull_request:
    branches: [main]
    paths:
      - .gitmodules
      - vendor/rune
      - Cargo.toml
      - Cargo.lock
      - crates/datazen-ui/**
      - scripts/build-rune-ui-web.sh
      - packages/web/src/main.tsx
      - packages/web/src/rune-ui.ts
      - packages/web/package.json
      - .github/workflows/rune-ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rune-ui-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Rune dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libvulkan-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Test shared Rune UI
        run: cargo test -p datazen-ui --lib

      - name: Check native desktop binary
        run: cargo check -p datazen-ui --bin datazen-rune

  webassembly:
    name: WebAssembly + wasm-bindgen bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Resolve the WebAssembly dependency graph
        run: cargo check -p datazen-ui --target wasm32-unknown-unknown --lib

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build Rune WebAssembly bundle
        run: bash scripts/build-rune-ui-web.sh
