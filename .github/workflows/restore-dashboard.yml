name: restore-dashboard
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/locale-domains-ready-and-codegen
          fetch-depth: 0
      - name: Restore DashboardPanel from main
        run: |
          git fetch origin main
          git checkout origin/main -- src/windows/dashboard/DashboardPanel.tsx
          # Apply minimal gate patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/windows/dashboard/DashboardPanel.tsx')
          text = p.read_text()
          text = text.replace(
              "import { useLocaleDomains } from '../../hooks/useLocaleDomains';\n",
              "import { useLocaleDomains } from '../../hooks/useLocaleDomains';\nimport { LocaleDomainLoading } from '../../components/LocaleDomainLoading';\n",
          )
          text, n = re.subn(
              r"  useLocaleDomains\(\['dashboard'\]\);",
              "  const localesReady = useLocaleDomains(['dashboard']);",
              text,
              count=1,
          )
          assert n == 1
          marker = "  const tabItems = list;\n\n"
          gate = (
              "  const tabItems = list;\n\n"
              "  if (!localesReady) {\n"
              "    return <LocaleDomainLoading variant=\"section\" testId=\"dashboard-locale-loading\" />;\n"
              "  }\n\n"
          )
          if 'if (!localesReady)' not in text:
              text = text.replace(marker, gate, 1)
          p.write_text(text)
          print('patched', p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows/dashboard/DashboardPanel.tsx
          git commit -m "fix(i18n): restore DashboardPanel from main with localesReady gate" || echo "no change"
          git push origin HEAD:fix/locale-domains-ready-and-codegen
