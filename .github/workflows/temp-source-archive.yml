name: Temporary source archive for review
on:
  push:
    branches:
      - refactor/reduce-code-duplication-2026-10
permissions:
  contents: read
jobs:
  source-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Archive repository
        run: git archive --format=tar.gz --prefix=datazen/ HEAD -o "$RUNNER_TEMP/datazen-source.tar.gz"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: datazen-source-archive
          path: ${{ runner.temp }}/datazen-source.tar.gz
          retention-days: 1
