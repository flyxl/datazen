name: Workflow DB tests

# 跨库 workflow 真 DB 用例（crates/datazen-desktop/tests/workflow_db_tests.rs，
# 原 workflow_tests.rs 的 tc02/04/05/06/07/13）的「有服务保障」运行位：
# PR CI 只编译该文件防烂（全部 #[ignore]），真跑在这里——每周一跑一次，
# 加手动触发（workflow_dispatch）供随时验证。
#
# 服务容器提供 PostgreSQL 16 与 MySQL 8（与本地 setup 脚本约定的
# TEST_PG_* / TEST_MYSQL_* 同一套变量名），scripts/setup-workflow-testdata.sh
# 灌入与 scripts/test-cross-db-workflow.yaml 对应的固定数据集。

on:
  schedule:
    # 每周一 19:25 UTC（北京周二 03:25）——避开整点拥挤。
    - cron: '25 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的定时/手动 run 重叠时取新弃旧。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATAZEN_KEYRING: file
  DATAZEN_VERIFY_DEPS_BEFORE_RUN: install
  # 与 ci.yml rust job 同款磁盘纪律（2026-11-04 run 1376 教训）：本 workflow
  # 同样是 workspace 级 cargo 重编译面，且 PG/MySQL 容器常驻占内存，debuginfo
  # 裁剪对磁盘/内存双收益。详见 ci.yml rust job 的 env 注释。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  workflow-db:
    runs-on: ubuntu-latest

    # GitHub 托管 runner 的 service 容器只对本 job 内的 localhost 端口开放；
    # 与 workflow_db_tests.rs 的 load_env()/DbConfig 生产的连接串逐字段对齐
    # （postgres://postgres:postgres@127.0.0.1:5432/postgres、
    # mysql://root:root@127.0.0.1:3306/datazen_test）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: datazen_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # 宿主 crate 构建需要 resolve-drivers（node_modules + node），与
      # ci.yml rust job 同链。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 与 ci.yml rust job 同一份 Tauri Linux 系统依赖（宿主 lib 链接需要）
      # 加 psql / mysql CLI——setup-workflow-testdata.sh 用它们灌数据。
      # 定时任务一周一次，apt 下载段不缓存（缓存是 PR CI 的省钱手段，
      # 这里直接付一次全价更简单）。
      - name: Install Linux system deps (Tauri + DB clients)
        run: |
          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            postgresql-client \
            default-mysql-client

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Resolve drivers (basic)
        run: node scripts/resolve-drivers.mjs --drivers=basic

      # .env 是 setup 脚本与测试二进制共同的连接事实源（脚本 source 它，
      # load_env() 解析它）；逐字段指向 service 容器。
      - name: Write .env for the service containers
        run: |
          cat > .env <<'EOF'
          TEST_PG_HOST=127.0.0.1
          TEST_PG_PORT=5432
          TEST_PG_USER=postgres
          TEST_PG_PASSWORD=postgres
          TEST_PG_DATABASE=postgres
          TEST_MYSQL_HOST=127.0.0.1
          TEST_MYSQL_PORT=3306
          TEST_MYSQL_USER=root
          TEST_MYSQL_PASSWORD=root
          TEST_MYSQL_DATABASE=datazen_test
          EOF

      - name: Seed cross-DB test data
        run: bash scripts/setup-workflow-testdata.sh

      # features 与 ci.yml 宿主集成步同集（$FEATURES,test-harness）：
      # 同一编译单元 = 直接吃 CI 主干 run 留下的 rust-cache，而不是把
      # 宿主 lib 无谓地重编一遍。--include-ignored 真跑全部用例；
      # --nocapture 保留 println 的跨库验证轨迹（libtest 默认吞 stdout）。
      - name: Run cross-DB workflow tests
        run: |
          FEATURES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.driver-features.json','utf8')).features.join(','))")
          cargo test -p datazen_desktop \
            --test workflow_db_tests \
            --features "$FEATURES,test-harness" \
            -- --include-ignored --nocapture
