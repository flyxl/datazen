[package]
name = "datazen-modules"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "DataZen feature modules: domain vocabulary, repository boundaries, and application use cases"

[features]
default = []
# 夹具门控：沿用旧 kernel/runtime 的 test-harness 语义（过渡期；D8 收敛）。
test-harness = []
settings = ["dep:async-trait", "dep:serde_json"]
# D2：连接目录（配置 + 分组）的领域词汇与用例。形状复用 driver-api 的
# ConnectionConfig（每个形态都已链接的那一份，且是连接表单的 IPC 载荷）。
connection = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:datazen-driver-api",
]
# D6 item 1：命名视图（保存的筛选视图）。规则与端口自 feature-core 迁入；
# driver-api 提供 filters 词汇（NamedView 的载荷）。
named_views = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:chrono",
    "dep:datazen-driver-api",
]
# D3：执行域词汇与应用边界 DTO。依赖 connection 的 NamespaceTarget（§4.2：
# execution 使用 connection 的执行配置读取契约）。
# D3：执行域词汇、应用边界 DTO 与机制内核（runtime 机制 D3-3b 起迁入：
# connection/registry/gateway/resource/directory/tunnel/artifact/latency）。
execution = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:indexmap",
    "dep:futures-util",
    "dep:chrono",
    "dep:sha2",
    "dep:hmac",
    "dep:libc",
    "connection",
    "settings",
]
# D4：Schema 元数据缓存与 DDL 判定（依赖 execution 的 driver_registry）。
schema = ["dep:tokio", "dep:datazen-infra", "execution"]
# D4-c：表浏览读链路（依赖 schema 的 SchemaCache）。
"table-browsing" = ["dep:serde_json", "schema"]
# D4-d：表编辑写链路（依赖 schema 缓存 + execution 产物读取词汇）。
"table-editing" = ["dep:async-trait", "dep:serde_json", "dep:uuid", "schema", "execution"]
# D5：Schema Diff 引擎（原 schema-diff crate 整体归位；三件套之一）。
# 词汇来自 driver-api；Profile 仓储 trait 在本模块（实现在宿主）；
# job handler 走 jobs 契约；schema 缓存与 execution 执行词汇随依赖进入。
schema_diff = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:chrono",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:datazen-driver-api",
    "jobs",
    "schema",
    "execution",
]
# D5：Data Sync 引擎（原 data-sync crate 整体归位；三件套之二）。
# rusqlite（bundled）随 comparison_store/plan_store 的 SQLite 侧实现进入——
# 形态中立（非平台 API）；D7 Web 装配时再评估是否上收宿主。
data_sync = [
    "dep:async-trait",
    "dep:base64",
    "dep:chrono",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:uuid",
    "dep:sha2",
    "dep:tokio",
    "dep:tracing",
    "dep:datazen-driver-api",
    "migration_common",
    "jobs",
    "schema",
    "execution",
]
# D5：迁移三件套的共享纯算法（原 migration-common crate 整体归位）。
# 不依赖三件套或 execution（01 §4.2）；driver-api 提供分类学词汇。
migration_common = ["dep:datazen-driver-api", "dep:serde_json"]
# D5：Job 运行时（domain/application/engine 三分；原 kernel::job 与
# platform-api 的 Job/时钟/原生工具词汇）。依赖 execution 的预算账本。
jobs = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:chrono",
    "dep:tokio",
    "dep:futures-util",
    "execution",
]
# D1.5：AI Provider 契约与适配整体并入（原 datazen-ai-api → datazen-ai-providers）。
# 单一 feature 承载 domain 契约 + providers 适配；若 D7 的 Web 形态需要拆分
# （如仅契约不带 reqwest），届时再拆，不提前建空档。
ai = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:inventory",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tracing",
    "dep:datazen-infra",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
# shared 常驻（id/context/error 词汇），serde 与 thiserror 因此非可选。
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "1"
# execution feature：机制代码（会话 actor/账本/产物/隧道）。
# futures-util / chrono 已在下方 ai / named_views 区声明（同名 optional dep），
# 这里不重复声明。
indexmap = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
# D5 data_sync：comparison_store / plan_store 的 SQLite 侧实现所需。
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
libc = { version = "0.2", optional = true }
# table-editing feature：变更集 ID 生成
uuid = { version = "1", features = ["v4", "serde"], optional = true }
# ai feature：契约层链接期工厂注册
inventory = { version = "0.3", optional = true }
# ai feature：providers 的并发与流式传输
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream", "cookies", "query", "form"], optional = true }
tracing = { version = "0.1", optional = true }
# ai feature：URL 脱敏等工具，来自垫底的 datazen-infra（drivers/modules/web/desktop 共用）
datazen-infra = { path = "../packages/infra", optional = true }

# connection / named_views features：连接配置形状与 filters 词汇（driver 契约 crate，允许的依赖边）
datazen-driver-api = { path = "../packages/driver-api", optional = true }
# named_views feature：created_at / updated_at 时间戳
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"], optional = true }

[dev-dependencies]
# shared 词汇单测（Counter 序列化、RequestContext 往返等）需要 serde_json。
serde_json = "1"
# 机制测试（产物落盘恢复等）需要临时目录。
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
tracing-subscriber = "0.3"
# data_sync 测试：家族归一化（sync_family_of）走 inventory 链接期工厂，
# 测试二进制必须链接 driver crate 才有工厂可查（与原 data-sync crate 的
# dev-deps 对齐，否则 mysql/mariadb、tidb 等别名判定退化成异构对）。
datazen-driver-postgres = { path = "../packages/drivers/postgres" }
datazen-driver-mysql = { path = "../packages/drivers/mysql" }
datazen-driver-sqlite = { path = "../packages/drivers/sqlite" }
