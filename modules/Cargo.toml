[package]
name = "datazen"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "DataZen feature modules: domain vocabulary, repository boundaries, and application use cases"

[[bin]]
name = "cm60-bench"
path = "src/bin/cm60-bench/main.rs"
required-features = ["execution", "jobs", "test-harness"]

[features]
default = []
application = [
    "connection",
    "execution",
    "dashboard",
    "schema_diff",
    "tunnel",
    "dep:async-trait",
    "dep:datazen-driver-api",
    "dep:serde_json",
]
# 夹具门控：沿用旧 kernel/runtime 的 test-harness 语义（过渡期；D8 收敛）。
test-harness = []
connection_import = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:argon2",
    "dep:base64",
    "dep:cbc",
    "dep:datazen-driver-api",
    "dep:dirs",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:rand",
    "dep:regex",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:sha1",
    "dep:sha2",
    "dep:uuid",
]
feature_error = [
    "dep:datazen-driver-api",
    "dep:serde_json",
    "ai",
    "table-editing",
    "export",
]
services = [
    "dep:async-trait",
    "dep:datazen-driver-api",
    "dep:serde_json",
    "dep:sha2",
    "dep:sqlparser",
    "dep:tokio",
    "ai",
    "feature_error",
    "schema",
    "table-browsing",
    "table-editing",
]
settings = ["dep:async-trait", "dep:serde_json"]
# D6 item 5 切片 a：备份与 SQL 恢复用例（BackupSource/BackupEvents 端口 +
# dump/restore 编排 + .sql/.sql.gz 流式恢复）。错误信封复用 export::
# ExportError（文件产物族共用）；flate2 承载 .sql.gz；SQL 只读校验沿用
# execution::domain::sql_guard。
backup = [
    "dep:async-trait",
    "dep:flate2",
    "dep:tokio",
    "dep:tracing",
    "dep:datazen-driver-api",
    "export",
]
# D6 item 5 切片 c：Workspace App 形态中立内核自 modules 归位
# （manifest 模式与校验、ZIP/目录安装、按 wapp 隔离的键值存储、注册表、
# URI 语法与路由判定）。zip-slip 防护沿用 infra::path_safety；regex 校验
# wapp id 与清单字段；uuid 铸安装实例 id；tracing 记注册表告警。
wapps = [
    "dep:serde_json",
    "dep:regex",
    "dep:zip",
    "dep:uuid",
    "dep:tracing",
    "dep:datazen-infra",
]
# D6 item 5 切片 a：表导出与文件产物作业（FileArtifactJob）自 modules
# 归位。zip 承载多文件归档；SQL 只读校验沿用 execution::domain::sql_guard，
# job 词汇来自 jobs；uuid 铸产物执行 id，chrono 已常驻。
export = [
    "dep:serde_json",
    "dep:zip",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:uuid",
    "dep:datazen-driver-api",
    "execution",
    "jobs",
]
# D6 item 1：查询历史与迁移运行历史（词汇/仓储端口/用例门面）。
# 轻量：serde/chrono 常驻（B248e153 后 chrono 为常驻依赖）+ async-trait（端口）
# + tracing（降级告警）。
history = ["dep:async-trait", "dep:tracing"]
# D6 item 3：workflow 全家族（切片 a 词汇 + 切片 b 引擎）。依赖 execution
# （目标/会话/SQL 分级词汇与请求 DTO）、schema（元数据命令合成）、
# table_editing（ArtifactChunkReader 端口）与 mcp（权限模式 + 命令准备策略）；
# serde_yaml 承载定义 YAML 编解码，tokio/tokio-util/futures-util 撑调度与
# 取消，tracing 记登记/调度告警，chrono 已常驻。
workflow = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:regex",
    "dep:datazen-driver-api",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:tracing",
    "execution",
    "schema",
    "table-editing",
    "mcp",
]
# D6 item 2：Dashboard 家族。依赖 workflow（组件绑定/归档引用 WorkflowDefinition）
# 与 execution（schedule_grant 的 ExecutionTarget）；tokio/tokio-util 撑刷新
# 监控引擎，uuid 铸运行/组件 id，serde_json 走归档字节解析。
dashboard = [
    "monitor",
    "workflow",
    "execution",
    "dep:async-trait",
    "dep:serde_json",
    "dep:sqlparser",
    "dep:tokio",
    "dep:tokio-util",
    "dep:uuid",
]
# D6 Monitor: shared grant/revision rules and scheduler. Its application
# implementation is compiled with the dashboard feature because it consumes
# dashboard widget records; the domain grant is independently reusable.
monitor = [
    "execution",
    "dep:async-trait",
    "dep:serde_json",
    "dep:sqlparser",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:uuid",
]
# D2：连接目录（配置 + 分组）的领域词汇与用例。形状复用 driver-api 的
# ConnectionConfig（每个形态都已链接的那一份，且是连接表单的 IPC 载荷）。
connection = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:datazen-driver-api",
]
# D6 item 1：命名视图（保存的筛选视图）。规则与端口自 modules 迁入；
# driver-api 提供 filters 词汇（NamedView 的载荷）。
named_views = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:datazen-driver-api",
]
# D3：执行域词汇与应用边界 DTO。依赖 connection 的 NamespaceTarget（§4.2：
# execution 使用 connection 的执行配置读取契约）。
# D3：执行域词汇、应用边界 DTO 与机制内核（runtime 机制 D3-3b 起迁入：
# connection/registry/gateway/resource/directory/tunnel/artifact/latency）。
execution = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:indexmap",
    "dep:futures-util",
    "dep:sha2",
    "dep:hmac",
    "dep:libc",
    "connection",
    "settings",
]
# D4：Schema 元数据缓存与 DDL 判定（依赖 execution 的 driver_registry）。
schema = ["dep:tokio", "dep:datazen-infra", "execution"]
# D4-c：表浏览读链路（依赖 schema 的 SchemaCache）。
# F4b api 用例层（读/预览）：请求 DTO 复用 grid 的表上下文词汇
# （RowChangeTableContext 在 table-editing），目标注入策略在 mcp，
# 目标/会话句柄词汇在 execution；async-trait 承载 TargetCommandRunner
# 端口，tracing 记估计回退告警，driver-api 提供驱动与方言契约。
"table-browsing" = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:tracing",
    "dep:datazen-driver-api",
    "schema",
    "execution",
    "mcp",
    "table-editing",
]
# D4-d：表编辑写链路（依赖 schema 缓存 + execution 产物读取词汇）。
"table-editing" = ["dep:async-trait", "dep:serde_json", "dep:uuid", "schema", "execution"]
# D5：Schema Diff 引擎（原 schema-diff crate 整体归位；三件套之一）。
# 词汇来自 driver-api；Profile 仓储 trait 在本模块（实现在宿主）；
# job handler 走 jobs 契约；schema 缓存与 execution 执行词汇随依赖进入。
schema_diff = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:datazen-driver-api",
    "jobs",
    "schema",
    "execution",
]
# D5：Data Sync 引擎（原 data-sync crate 整体归位；三件套之二）。
# fd-lock 随 comparison_store 的跨进程排他租约进入（host-boundary F1：
# SQLite 排他事务换成 flock/LockFileEx，进程死亡由内核放锁；data_sync 不再
# 依赖 rusqlite）。形态中立（非平台 API）。
data_sync = [
    "dep:async-trait",
    "dep:base64",
    "dep:fd-lock",
    "dep:serde_json",
    "dep:uuid",
    "dep:sha2",
    "dep:tokio",
    "dep:tracing",
    "dep:datazen-driver-api",
    "common",
    "jobs",
    "schema",
    "execution",
]
# D5：Data Transfer 引擎（原 data-transfer crate 整体归位；三件套之三）。
# flate2 随 sql_file 的 gzip 读写进入（形态中立）；inventory 随 transfer
# 适配器的链接期自注册进入（与 ai feature 共用同一 optional dep）。
data_transfer = [
    "dep:async-trait",
    "dep:base64",
    "dep:flate2",
    "dep:inventory",
    "dep:serde_json",
    "dep:uuid",
    "dep:sha2",
    "dep:tokio",
    "dep:tracing",
    "dep:datazen-driver-api",
    "common",
    "jobs",
    "schema",
    "execution",
]
# D6 item 5：隧道配置/known-hosts 领域端口与形态中立的 SSH、HTTP CONNECT、WebSocket
# 机制整体归位。网络出口与文件持久化仍由宿主注入；本 feature 不依赖 platform-api。
tunnel = [
    "dep:async-trait",
    "dep:futures-util",
    "dep:russh",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
    "dep:tokio-util",
    "dep:url",
    "dep:webpki-roots",
    "dep:tracing",
    "dep:datazen-driver-api",
    "dep:serde_json",
    "dep:uuid",
]
# D5：迁移三件套的共享纯算法（原 migration-common crate 整体归位）。
# 不依赖三件套或 execution（01 §4.2）；driver-api 提供分类学词汇。
common = ["dep:datazen-driver-api", "dep:serde_json"]
# D5：Job 运行时（domain/application/engine 三分；原 kernel::job 与
# platform-api 的 Job/时钟/原生工具词汇）。依赖 execution 的预算账本。
jobs = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:tokio",
    "dep:futures-util",
    "execution",
]
# D1.5：AI Provider 契约与适配整体并入（原 datazen-ai-api → datazen-ai-providers）。
# 单一 feature 承载 domain 契约 + providers 适配；若 D7 的 Web 形态需要拆分
# （如仅契约不带 reqwest），届时再拆，不提前建空档。
# D6 item 4 收尾：会话编排/工具循环/安全策略（chat_request、tool_loop、tools、
# cancel、ownership、single_turn 家族、schema 上下文管道）自 modules 归位
# application 层。新增依赖：mcp（db_tools 的 SQL 分级与白名单判据）、
# workflow（schema_context 经 ResourceExecutionHost 走共享执行网关；
# workflow 已传递 execution/schema/table-editing）、uuid（请求 id 铸造）。
ai = [
    "dep:async-trait",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:regex",
    "dep:inventory",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tracing",
    "dep:datazen-infra",
    "dep:datazen-driver-api",
    "dep:uuid",
    "settings",
    "connection",
    "mcp",
    "workflow",
]

# D6 item 4 切片一：MCP 业务规则（权限模式/连接白名单/表描述格式化）。
# permission 的 SQL 分级依赖 execution::domain::sql_guard（不另立判据）；
# check_tool_call 的参数面需要 serde_json，describe 消费 driver-api 的
# TableSchema。
mcp = [
    "execution",
    "schema",
    "dep:serde_json",
    "dep:datazen-driver-api",
]

# D5 data_transfer：debug 构建 + webdriver E2E 的故障注入 seam（commit-ack 丢失）。
# 纯 cfg 开关无依赖；src-tauri 的 webdriver feature 直接转发到 data_transfer
# 垫片转发进来（原 data-transfer crate 同名 feature 的语义原样承接）。
webdriver = []

[dependencies]
async-trait = { workspace = true, optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { workspace = true, optional = true }
argon2 = { version = "0.5", optional = true }
# shared 常驻（id/context/error 词汇），serde 与 thiserror 因此非可选。
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
# execution feature：机制代码（会话 actor/账本/产物/隧道）。
# futures-util / chrono 已在下方 ai / named_views 区声明（同名 optional dep），
# 这里不重复声明。
indexmap = { version = "2", optional = true }
sha2 = { workspace = true, optional = true }
# comparison_store 的跨进程排他租约（flock / LockFileEx；宿主边界 F1 替换
# SQLite 租约。单一消费者，按 P1 口径不上收 workspace 根表）。
fd-lock = { version = "4", optional = true }
# connection_import：读取 DBX 的 dbx.db（只读打开活库，先复制 -wal/-shm）。
# data_sync 的比对租约已改用 fd-lock，不再依赖 rusqlite（host-boundary F1）。
rusqlite = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cbc = { version = "0.1", optional = true }
dirs = { version = "5", optional = true }
# D6 item 5 切片 a：export 模块的多文件归档（仅 deflate，与 modules 同款）。
zip = { workspace = true, optional = true }
# D5 data_transfer：sql_file 的 gzip 读写（.sql.gz 导入导出）。
flate2 = { version = "1.1.9", optional = true }
hmac = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
pbkdf2 = { version = "0.12", optional = true }
rand = { workspace = true, optional = true }
# table-editing feature：变更集 ID 生成
uuid = { workspace = true, optional = true }
# dashboard schedule_grant 的只读 SQL 校验（解析/AST/visitor）。
sqlparser = { workspace = true, optional = true }
sha1 = { version = "0.10", optional = true }
# ai feature：契约层链接期工厂注册
inventory = { workspace = true, optional = true }
# ai feature：providers 的并发与流式传输
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "fs", "io-util"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
futures-util = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
webpki-roots = { version = "0.26", optional = true }
reqwest = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# ai feature：URL 脱敏等工具，来自垫底的 datazen-infra（drivers/modules/web/desktop 共用）
datazen-infra = { workspace = true, optional = true }

# connection / named_views features：连接配置形状与 filters 词汇（driver 契约 crate，允许的依赖边）
datazen-driver-api = { workspace = true, optional = true }
# shared::clock 的 SystemClock 生产实现常驻需要 chrono（D5 随 shared 自
# platform-api 归位）。不再是可选依赖：shared 无 feature 门，且
# run-platform-crate-tests.mjs 的单 feature 矩阵腿（settings/connection 等）
# 不带 named_views，若可选则默认/单 feature 构建在 clock.rs 处编译破损。
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# workflow feature：定义 YAML 编解码（registry encode/decode）。
serde_yaml = { workspace = true, optional = true }
# workflow feature：上下文模板 {{var}} 解析；ai feature：脱敏正则。
regex = { workspace = true, optional = true }

[dev-dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# shared 词汇单测（Counter 序列化、RequestContext 往返等）需要 serde_json。
serde_json = { workspace = true }
# workflow 模型词汇单测（YAML 往返——workflow 在宿主侧以 YAML 落盘/导出）。
serde_yaml = { workspace = true }
# 机制测试（产物落盘恢复等）需要临时目录。
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
tracing-subscriber = "0.3"
# data_sync 测试：家族归一化（sync_family_of）走 inventory 链接期工厂，
# 测试二进制必须链接 driver crate 才有工厂可查（与原 data-sync crate 的
# dev-deps 对齐，否则 mysql/mariadb、tidb 等别名判定退化成异构对）。
datazen-driver-postgres = { workspace = true }
datazen-driver-mysql = { workspace = true }
datazen-driver-sqlite = { workspace = true }

[lints]
# lint 定义上收 workspace 根（[workspace.lints.rust]），完整理由见根 Cargo.toml。
workspace = true
