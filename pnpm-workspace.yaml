# form-split F6（计划 §5.6 项1）：workspace 协议落地。`apps/*` 目前为空
# glob（分家迁移合入后出现 apps/desktop）；`packages/drivers/*` 当前全部为
# 纯 Rust crate + TS UI 目录（无 package.json，pnpm 跳过），列出的目的是
# 驱动包未来获得 package.json 时自动纳入而无需改这里。既有 5 个 TS 包
# （backend-client / driver-sdk / extension-points / ui / wapp-sdk）成为
# 真 workspace importer —— 但在 F6-b 之前跨包解析仍骑在 vite / tsconfig /
# vitest 三张 alias 表上，此提交仅落地协议本身（§7.1 风险实测见 worklog）。
packages:
  - apps/*
  - packages/*
  - packages/drivers/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  edgedriver: true
  geckodriver: true

# pnpm 在 `run` / `exec` 之前会校验 node_modules 是否与锁文件同步（默认值 install：
# 不同步就先装一次）。本仓的工作树把 node_modules 软链到主 checkout，pnpm 认不出链接
# 目标、判定依赖过期，于是每次 `pnpm <script>` 前都先试装一次，而这次安装必然失败：
#
#   × installing dependencies
#     ╰─▶ Failed to create directory at ".../.worktrees/<track>/node_modules":
#         workspace hoist directory is not a real directory
#
# 脚本随后仍会执行（退出码 0），但这段安装报错噪声出现在所有脚本之前，极易被误判成
# 真失败。pnpm 自己在报错末尾推荐的键就是这一个，故按它关掉。
#
# **CI 必须显式打开**：.github/workflows/ci.yml 与 release.yml 的 workflow 级 env 都设
# `DATAZEN_VERIFY_DEPS_BEFORE_RUN: install`。这样「node_modules 与锁文件不同步」在 CI 里
# 仍然会被校验；「锁文件与 package.json 不同步」另有 `pnpm install --frozen-lockfile`
# 直接硬失败。本地需要同步依赖时显式跑 `pnpm install`。
verifyDepsBeforeRun: ${DATAZEN_VERIFY_DEPS_BEFORE_RUN:-false}
