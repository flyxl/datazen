[package]
name = "datazen-driver-redis"
version = "0.0.10"
edition = "2021"
description = "DataZen redis database driver"
license = "GPL-3.0-or-later"

[features]
default = []

[dependencies]
datazen-driver-api = { workspace = true }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "cluster-async", "sentinel", "tls-rustls", "tls-rustls-insecure", "tokio-rustls-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
urlencoding = "2"
flate2 = "1.1.9"
rmpv = "1.3.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Reproduce a full-driver build's ambiguous rustls feature union.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "ring", "std", "tls12"] }
