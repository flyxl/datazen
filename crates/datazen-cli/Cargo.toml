[package]
name = "datazen-cli"
version = "0.2.3"
description = "DataZen headless CLI for read-only connection and query access"
authors = ["DataZen"]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[[bin]]
name = "datazen"
path = "src/main.rs"

[dependencies]
datazen = { workspace = true, features = ["connection", "execution"] }
datazen-driver-api = { workspace = true }
# Compiled drivers are linked so `inventory` can discover their factories.
datazen-driver-mysql = { workspace = true }
datazen-driver-postgres = { workspace = true }
datazen-driver-sqlite = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
keyring = { version = "4", features = ["v1"] }

[dev-dependencies]
tempfile = "3"
