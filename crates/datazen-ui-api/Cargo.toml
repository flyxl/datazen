[package]
name = "datazen-ui-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "UI contracts and in-memory workspace for the DataZen Rune interface"

[dependencies]
# The metadata identity keys are `JSON.stringify`-canonical strings;
# `serde_json::Value`'s compact `Display` is the byte-exact serializer for
# them (see src/metadata/identity.rs). Same workspace pin the rest of the
# graph already uses.
serde_json = { workspace = true }
# ai_sessions (T040) mirrors React's stored/IPC DTOs (localStorage blob and
# the `aiCommands.sessions*` payloads) as camelCase serde shapes, with the
# order-preserving SessionMap hand-implementing the JS object-key contract
# on top of serde_json's stream. Workspace pin (`derive` feature), wasm-safe.
serde = { workspace = true }

[lints]
workspace = true
