[package]
name = "datazen-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared Rune UI for DataZen native desktop and web"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "datazen-rune"
path = "src/main.rs"

[dependencies]
datazen-ui-api = { workspace = true }
rune = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[dev-dependencies]
# H8's tofu test reads glyph ids out of a shaped layout; the same version and
# features rune itself uses, so the graph stays one parley.
parley = { version = "0.12", default-features = false, features = ["std", "complex-scripts"] }
# C2's a11y test reads the tree `Runtime::accessibility_json` builds; the same
# version the workspace pins, so the graph stays one serde_json.
serde_json = { workspace = true }

[lints]
workspace = true
