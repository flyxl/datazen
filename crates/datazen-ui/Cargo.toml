[package]
name = "datazen-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared Rune UI for DataZen native desktop and web"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "datazen-rune"
path = "src/main.rs"

[dependencies]
rune = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true
