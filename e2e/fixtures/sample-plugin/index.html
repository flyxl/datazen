<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample Hello</title>
    <!--
      F9 E2E fixture page: zero build, no SDK import.
      The bridge client lives in assets/app.js because the host serves package
      assets with CSP without 'unsafe-inline' in script-src — inline <script>
      blocks would never execute inside the sandboxed iframe. Subresource URLs
      must stay under datazen:// (matched by script-src/img-src 'self' datazen:).

      Theme-consistency spec (packages/extensions/README.md): colors come from
      the host's --c-*/--dt-* tokens (applied to :root by app.js on
      host.ready / theme.apply); literal fallbacks only cover the instant
      before the first snapshot lands.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 12px 16px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        background: var(--c-surface, #ffffff);
        color: var(--c-fg, #111827);
      }
    </style>
  </head>
  <body>
    <p>bridge: <span data-testid="bridge-status">booting</span></p>
    <p>connections: <span data-testid="conn-count">-</span></p>
    <p>storage-roundtrip: <span data-testid="storage-roundtrip">-</span></p>
    <p>mode: <span data-testid="dark-state">-</span></p>
    <p>tokens: <span data-testid="token-count">-</span></p>
    <p>query-probe: <span data-testid="query-probe">-</span></p>
    <p data-testid="probe-error" hidden></p>
    <script src="assets/app.js"></script>
  </body>
</html>
