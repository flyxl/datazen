[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "packages/driver-api",
    "packages/infra",
    "modules",
    "packages/drivers/*",
]
exclude = [
    "packages/drivers/kiwi",
    "packages/drivers/superset",
]

[workspace.dependencies]
datazen-driver-api = { path = "packages/driver-api" }
datazen = { path = "modules", default-features = false }

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# Driver patches — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-patches>>
# <</driver-patches>>
