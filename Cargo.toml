[workspace]
resolver = "2"
members = [
    "src-tauri",
    "packages/driver-api",
    "packages/ai-api",
]
exclude = [
    ".plugins/*",
]

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[patch."https://github.com/flyxl/datazen-driver-api.git"]
datazen-driver-api = { path = "packages/driver-api" }

# Plugin patches — injected by resolve-plugins.mjs at build time; do NOT add manually.
# <<plugin-patches>>

[patch."https://github.com/flyxl/datazen-plugin-kiwi.git"]
datazen-plugin-kiwi = { path = ".plugins/kiwi" }

[patch."https://github.com/flyxl/datazen-plugin-olap.git"]
datazen-plugin-olap = { path = ".plugins/olap" }

[patch."https://github.com/flyxl/datazen-plugin-superset.git"]
datazen-plugin-superset = { path = ".plugins/superset" }
# <</plugin-patches>>
