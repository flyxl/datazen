[workspace]
resolver = "2"
members = [
    "src-tauri",
    "packages/driver-api",
    "packages/platform-api",
    "packages/platform-infra",
    "packages/application",
    "packages/runtime",
    "packages/kernel",
    "packages/tunnel",
    "packages/feature-core",
    "packages/ai-providers",
    "packages/schema-diff",
    "packages/data-sync",
    "packages/migration-common",
    "packages/data-transfer",
    "modules",
    "packages/drivers/*",
]
exclude = [
    "packages/drivers/kiwi",
    "packages/drivers/superset",
]

[workspace.dependencies]
datazen-driver-api = { path = "packages/driver-api" }
datazen-platform-api = { path = "packages/platform-api" }
datazen-application = { path = "packages/application" }
datazen-kernel = { path = "packages/kernel" }
datazen-feature-core = { path = "packages/feature-core" }
datazen-schema-diff = { path = "packages/schema-diff" }
datazen-migration-common = { path = "packages/migration-common" }
datazen-data-sync = { path = "packages/data-sync" }
datazen-data-transfer = { path = "packages/data-transfer" }
datazen-modules = { path = "modules", default-features = false }

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# Driver patches — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-patches>>
# <</driver-patches>>
