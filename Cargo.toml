[workspace]
resolver = "2"
members = [
    "src-tauri",
    "packages/driver-api",
    "packages/ai-api",
    "packages/platform-api",
    "packages/application",
    "packages/runtime",
    "packages/drivers/*",
]
exclude = [
    "packages/drivers/kiwi",
    "packages/drivers/olap",
    "packages/drivers/superset",
]

[workspace.dependencies]
datazen-driver-api = { path = "packages/driver-api" }
datazen-platform-api = { path = "packages/platform-api" }
datazen-application = { path = "packages/application" }

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# Driver patches — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-patches>>
# <</driver-patches>>
