<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="Schema Diff UI journey storyboard">
  <rect width="960" height="720" fill="#0f172a"/>
