    <rect x="12" y="36" width="272" height="20" fill="#0f172a" stroke="#475569"/>
    <rect x="12" y="64" width="130" height="24" rx="4" fill="#3b82f6"/>
    <text x="24" y="80" fill="#fff" font-size="10" font-family="system-ui">Compare</text>
