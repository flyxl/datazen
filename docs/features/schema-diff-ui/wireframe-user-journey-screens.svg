    <text x="20" y="120" fill="#94a3b8" font-size="9" font-family="system-ui">SchemaDiffPanel per table</text>
  </g>
  <g transform="translate(332,48)">
    <rect width="296" height="640" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="148" y="24" fill="#3b82f6" font-size="12" font-family="system-ui" text-anchor="middle" font-weight="600">2 Plan</text>
    <rect x="12" y="64" width="272" height="120" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="20" y="84" fill="#94a3b8" font-size="9" font-family="system-ui">allowDestructive / includeIndexes</text>
