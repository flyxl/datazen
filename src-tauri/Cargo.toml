[package]
name = "datazen"
version = "0.0.8"
description = "DataZen desktop database client (Tauri backend)"
authors = ["DataZen"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "datazen"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datazen-driver-api = { git = "https://github.com/flyxl/datazen-driver-api.git" }
datazen-ai-api = { path = "../packages/ai-api" }
inventory = "0.3"
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "json",
    "rust_decimal",
    "uuid",
] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
sysinfo = "0.30"
async-trait = "0.1"
urlencoding = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2.3.2"
sys-locale = "0.3.2"
flate2 = "1.1.9"
russh = "0.60"
reqwest = { version = "0.13.3", features = ["json", "cookies", "stream"] }
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Plugin crates — injected by resolve-plugins.mjs at build time; do NOT add manually.
# <<plugin-dependencies>>
# <</plugin-dependencies>>
rmcp = { version = "2.2.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1.2.2"
tokio-util = { version = "0.7.19", features = ["rt"] }
dirs = "6.0.0"
keyring = { version = "4", features = ["v1"] }
serde_yaml = "0.9.34"
regex = "1.13.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = []
webdriver = ["tauri-plugin-webdriver"]
# Plugin features — injected by resolve-plugins.mjs at build time; do NOT add manually.
# <<plugin-features>>
# <</plugin-features>>


[dev-dependencies]
tempfile = "3.27.0"
