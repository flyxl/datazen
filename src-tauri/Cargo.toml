[package]
name = "datazen"
version = "0.0.9"
description = "DataZen desktop database client (Tauri backend)"
authors = ["DataZen"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "datazen"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datazen-driver-api = { workspace = true }
datazen-ai-api = { path = "../packages/ai-api" }
inventory = "0.3"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
sysinfo = "0.30"
async-trait = "0.1"
urlencoding = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2.3.2"
sys-locale = "0.3.2"
flate2 = "1.1.9"
russh = "0.60"
reqwest = { version = "0.13.3", features = ["json", "cookies", "stream", "query", "form"] }
futures-util = "0.3"

# Driver crates — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<plugin-dependencies>>
# <</plugin-dependencies>>
rmcp = { version = "2.2.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1.2.2"
tokio-util = { version = "0.7.19", features = ["rt", "compat"] }
dirs = "6.0.0"
keyring = { version = "4", features = ["v1"] }
serde_yaml = "0.9.34"
regex = "1.13.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pbkdf2 = "0.12"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"

[features]
default = []
webdriver = ["tauri-plugin-webdriver"]
# Driver features — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<plugin-features>>
# <</plugin-features>>


[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6"
datazen-driver-postgres = { path = "../packages/drivers/postgres" }
datazen-driver-mysql = { path = "../packages/drivers/mysql" }
