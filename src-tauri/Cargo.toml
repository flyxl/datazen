[package]
name = "datazen"
version = "0.1.11"
description = "A modern database client"
authors = ["flyxl"]
edition = "2021"
default-run = "datazen"

[lib]
name = "datazen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }
keyring = { workspace = true }
regex = { workspace = true }
open = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
datazen-driver-api = { workspace = true }
# Optional OS helpers
arboard = "3"

tauri-plugin-webdriver = { version = "0.2", optional = true }

# Driver crates — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-dependencies>>
# <</driver-dependencies>>

[features]
default = []
webdriver = ["tauri-plugin-webdriver"]
# Driver features — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-features>>
# <</driver-features>>

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
datazen-driver-postgres = { path = "../packages/drivers/postgres" }
datazen-driver-mysql = { path = "../packages/drivers/mysql" }
datazen-driver-sqlite = { path = "../packages/drivers/sqlite" }

[[test]]
name = "driver_command_ipc"
path = "tests/driver_command_ipc.rs"

# Driver/plugin features are injected by resolve-drivers.mjs at build time; declare
# them here so standalone `cargo check` does not treat them as unexpected cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("driver-postgres", "driver-mysql", "driver-sqlite", "driver-redis", "driver-sqlserver", "driver-clickhouse", "driver-duckdb", "driver-elasticsearch", "driver-mongodb", "driver-influxdb", "driver-victoriametrics", "driver-hbase", "driver-vector", "driver-jdbc", "driver-olap", "plugin-postgres", "plugin-mysql", "plugin-sqlite", "plugin-redis", "plugin-kiwi", "plugin-superset"))'] }
