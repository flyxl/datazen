[package]
name = "datazen"
version = "0.2.3"
description = "DataZen desktop database client (Tauri backend)"
authors = ["DataZen"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "datazen"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datazen-driver-api = { workspace = true }
datazen-ai-api = { path = "../packages/ai-api" }
inventory = "0.3"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "devtools"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
sysinfo = "0.30"
async-trait = "0.1"
urlencoding = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sys-locale = "0.3.2"
flate2 = "1.1.9"
russh = "0.60"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
url = "2"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "stream", "cookies", "query", "form"] }
futures-util = "0.3"

# Driver crates — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-dependencies>>
# <</driver-dependencies>>
rmcp = { version = "2.2.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1.2.2"
tokio-util = { version = "0.7.19", features = ["rt", "compat"] }
dirs = "6.0.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
keyring = { version = "4", features = ["v1"] }
serde_yaml = "0.9.34"
regex = "1.13.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pbkdf2 = "0.12"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"

tempfile = { version = "3.27.0", optional = true }

# macOS 静默 E2E：让 webdriver 构建在 `DATAZEN_E2E_QUIET` 下拒绝进程激活，
# 避免本地跑测试时抢走开发者焦点（见 `src/e2e_quiet.rs`）。两个 crate 都由
# `webdriver` feature 引入，正式构建既不编译也不链接它们。
#
# 必须放在 `<<driver-dependencies>>` 标记**之后**：`resolve-drivers.mjs` 只替换两个
# 标签之间的内容，若在本表头之前插入 `[dependencies]` 的后半段（含标记）会被一并
# 划进这张表，导致注入的驱动依赖变成 macOS 专属、Linux/Windows 构建失败。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }

[features]
default = []
webdriver = ["tauri-plugin-webdriver", "dep:objc2", "dep:objc2-app-kit"]
# Enables `datazen::test_harness` for src-tauri/tests/ IPC migration integration tests.
test-harness = ["dep:tempfile"]
# Driver features — injected by resolve-drivers.mjs at build time; do NOT add manually.
# <<driver-features>>
# <</driver-features>>


[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6"
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql"] }
datazen-driver-postgres = { path = "../packages/drivers/postgres" }
datazen-driver-mysql = { path = "../packages/drivers/mysql" }
datazen-driver-sqlite = { path = "../packages/drivers/sqlite" }

[[test]]
name = "driver_command_ipc"
required-features = ["test-harness"]

[lints.rust]
# Driver/plugin features are injected by resolve-drivers.mjs at build time; declare
# them here so standalone `cargo check` does not treat them as unexpected cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("driver-postgres", "driver-mysql", "driver-sqlite", "driver-redis", "driver-sqlserver", "driver-clickhouse", "driver-duckdb", "driver-elasticsearch", "driver-mongodb", "driver-influxdb", "driver-victoriametrics", "driver-hbase", "driver-vector", "driver-olap", "plugin-postgres", "plugin-mysql", "plugin-sqlite", "plugin-redis", "plugin-kiwi", "plugin-superset"))'] }
